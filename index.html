<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالم الصغار التعليمي 🎈</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#F59E0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(180deg, #FDE68A 0%, #FEF3C7 100%);
      min-height: 100vh;
      padding: 10px 10px 100px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 900;
      color: #D97706;
      text-shadow: 2px 2px #fff;
    }
    .update-btn {
      background: #FFFFFF;
      border: 2px solid #D97706;
      color: #B45309;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #D97706;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 440px;
      margin-top: 10px;
    }

    .category-card {
      background: #FFFFFF;
      border: 4px solid #F59E0B;
      border-radius: 26px;
      padding: 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 0px #D97706;
    }
    .category-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #D97706; }
    .card-icon-badge {
      font-size: 34px;
      font-weight: 900;
      color: #D97706;
      background: #FEF3C7;
      padding: 8px 18px;
      border-radius: 20px;
    }
    .card-name { font-size: 22px; font-weight: 900; color: #78350F; }

    .screen-panel {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
    }

    .back-btn {
      background: #EF4444;
      border: 3px solid #B91C1C;
      color: white;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 18px;
      box-shadow: 0 4px 0 #991B1B;
      cursor: pointer;
    }

    .activities-dropdown-btn {
      background: #3B82F6;
      border: 3px solid #1D4ED8;
      color: white;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 18px;
      box-shadow: 0 4px 0 #1E40AF;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .activities-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10000;
      align-items: flex-end;
      justify-content: center;
    }
    .activities-modal.active { display: flex; }
    .activities-sheet {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      border-radius: 26px 26px 0 0;
      padding: 20px 16px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
    }
    .modal-game-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: 16px;
      border: 2px solid #E2E8F0;
      background: #F8FAFC;
      font-size: 17px;
      font-weight: 900;
      color: #1E293B;
      cursor: pointer;
      width: 100%;
      text-align: right;
    }
    .modal-game-item:active { background: #E0E7FF; border-color: #6366F1; }

    /* بطاقة فردية عملاقة بملء الشاشة */
    .single-card-fullscreen {
      width: 95vw;
      max-width: 440px;
      height: 68vh;
      background: #FFFFFF;
      border: 5px solid #F59E0B;
      border-radius: 30px;
      box-shadow: 0 10px 0 #D97706;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px;
      margin-top: 6px;
    }
    .hero-char-big {
      font-size: 110px;
      font-weight: 900;
      color: #1E3A8A;
      line-height: 1;
    }
    .hero-emoji-big {
      font-size: 110px;
      line-height: 1;
    }
    .hero-word-big {
      font-size: 34px;
      font-weight: 900;
      color: #374151;
    }

    /* لعبة الكتابة التفاعلية الفاحصة */
    .write-box {
      width: 100%;
      background: white;
      border: 4px solid #3B82F6;
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 6px 0 #1D4ED8;
      text-align: center;
      margin-top: 4px;
    }
    .write-canvas-fullscreen {
      width: 92vw;
      max-width: 420px;
      height: 48vh;
      background: #F8FAFC;
      border: 4px dashed #93C5FD;
      border-radius: 20px;
      touch-action: none;
      margin-top: 8px;
    }

    /* التوصيل التفاعلي */
    .matching-box-panel {
      width: 100%;
      background: white;
      border: 4px solid #10B981;
      border-radius: 24px;
      padding: 14px 10px;
      box-shadow: 0 6px 0 #059669;
      text-align: center;
      margin-top: 4px;
    }
    .matching-board {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 48%;
    }
    .match-btn {
      background: #F8FAFC;
      border: 4px solid #3B82F6;
      border-radius: 20px;
      padding: 14px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 36px;
      font-weight: 900;
      color: #1E3A8A;
      box-shadow: 0 5px 0 #1D4ED8;
      cursor: pointer;
    }
    .match-btn.selected {
      background: #FEF08A;
      border-color: #EAB308;
      transform: scale(1.04);
    }
    .match-btn.matched {
      background: #DCFCE7 !important;
      border-color: #16A34A !important;
      color: #15803D !important;
      box-shadow: 0 5px 0 #15803D !important;
    }

    @keyframes shakeAnimation {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-12px); }
      40%, 80% { transform: translateX(12px); }
    }
    .shake-error {
      animation: shakeAnimation 0.4s ease-in-out;
      border-color: #EF4444 !important;
      background: #FEE2E2 !important;
    }

    /* التلوين بملء الشاشة */
    .fullscreen-paint-box {
      width: 100vw;
      height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .fullscreen-canvas {
      width: 95vw;
      max-width: 440px;
      height: 60vh;
      background: #FFFFFF;
      border: 5px solid #F59E0B;
      border-radius: 26px;
      box-shadow: 0 8px 0 #D97706;
      touch-action: none;
    }
    .color-palette {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      justify-content: center;
    }
    .color-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    .color-dot.active { transform: scale(1.2); border-color: #111; }

    /* شريط اختيار الحرف السفلي */
    .letter-selector-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 4px solid #F59E0B;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 9999;
      max-width: 500px;
      margin: 0 auto;
    }
    .selector-nav-btn {
      background: #EFF6FF;
      border: 3px solid #3B82F6;
      border-radius: 16px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: 900;
      color: #1D4ED8;
      cursor: pointer;
      box-shadow: 0 3px 0 #2563EB;
    }
    .current-letter-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FEF3C7;
      border: 2px solid #F59E0B;
      border-radius: 16px;
      padding: 4px 14px;
    }
    .current-char-badge {
      font-size: 34px;
      font-weight: 900;
      color: #D97706;
    }
  </style>
</head>
<body>

  <!-- القائمة الرئيسية -->
  <div id="screen-main" style="width: 100%; max-width: 500px;">
    <div class="top-bar">
      <div class="app-title">🎈 عالم الأذكياء الصغار</div>
      <button class="update-btn" onclick="forceAppUpdate()">🔄 تحديث اللعبة</button>
    </div>
    
    <div class="menu-grid">
      <div class="category-card" onclick="enterCategory('ar')">
        <div class="card-name">الحروف العربية وألعابها</div>
        <span class="card-icon-badge">أ ب ت</span>
      </div>
      <div class="category-card" onclick="enterCategory('en')">
        <div class="card-name">الحروف الإنجليزية وألعابها</div>
        <span class="card-icon-badge">A B C</span>
      </div>
      <div class="category-card" onclick="enterCategory('numbers')">
        <div class="card-name">الأرقام من 1 إلى 10</div>
        <span class="card-icon-badge">١ ٢ ٣</span>
      </div>
    </div>
  </div>

  <!-- شاشة القسم المختار -->
  <div id="screen-category" class="screen-panel">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 6px;">
      <button class="back-btn" onclick="showScreen('screen-main')">🔙 القائمة</button>
      <div id="category-title" style="font-size: 18px; font-weight: 900; color: #78350F;"></div>
      <button class="activities-dropdown-btn" onclick="toggleActivitiesModal()">🎯 الألعاب ▾</button>
    </div>

    <div id="activities-modal" class="activities-modal" onclick="toggleActivitiesModal()">
      <div class="activities-sheet" onclick="event.stopPropagation()">
        <div style="font-size: 19px; font-weight: 900; color: #1E293B; margin-bottom: 12px; text-align: center;">اخْتَارِ اللُّعْبَة المُمْتِعَة 🎮</div>
        <button class="modal-game-item" onclick="selectTabFromModal('learn')">📖 بطاقة الحرف الكبيرة</button>
        <button class="modal-game-item" onclick="selectTabFromModal('write')">✍️ اكتب الحرف وافحص خطك</button>
        <button class="modal-game-item" onclick="selectTabFromModal('match')">🎯 توصيل مكثف للحرف</button>
        <button class="modal-game-item" onclick="selectTabFromModal('color')">🎨 تلوين الحرف العملاق</button>
        <button class="back-btn" style="width: 100%; margin-top: 10px; border-radius: 14px;" onclick="toggleActivitiesModal()">إلغاء ✕</button>
      </div>
    </div>

    <!-- 1. شاشة البطاقة الفردية العملاقة -->
    <div id="cat-view-learn" class="single-card-fullscreen" onclick="speakCurrentLetter()">
      <div class="hero-char-big" id="card-hero-char">أ</div>
      <div class="hero-emoji-big" id="card-hero-emoji">🐰</div>
      <div class="hero-word-big" id="card-hero-word">أرنب</div>
      <div style="font-size: 16px; font-weight: 900; color: #B45309; background: #FEF3C7; padding: 6px 18px; border-radius: 20px;">🔊 اضغط للاستماع</div>
    </div>

    <!-- 2. لعبة كتابة الحرف الفاحصة -->
    <div id="cat-view-write" class="write-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 38px;" id="write-hero-emoji">🐰</span>
        <span style="font-size: 20px; font-weight: 900; color: #1E3A8A;" id="write-title-text">اكتب الحرف بإصبعك</span>
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; padding: 4px 10px; font-size: 13px;" onclick="clearWriteCanvas()">مسح 🗑️</button>
      </div>
      <canvas id="write-canvas" class="write-canvas-fullscreen"></canvas>
      <button class="back-btn" style="background: #10B981; border-color: #059669; width: 100%; margin-top: 8px; padding: 12px; font-size: 18px;" onclick="verifyUserHandwriting()">تأكيد الرسمة وفحص الحرف ✅</button>
    </div>

    <!-- 3. شاشة التوصيل المكثف -->
    <div id="cat-view-match" class="matching-box-panel" style="display: none;">
      <div style="font-size: 19px; font-weight: 900; color: #065F46;" id="match-instructions">وصّل بالصورة المناسبة 👇</div>
      <div class="matching-board" id="matching-board-container">
        <div class="match-col" id="match-col-right"></div>
        <div class="match-col" id="match-col-left"></div>
      </div>
    </div>

    <!-- 4. شاشة التلوين العملاقة -->
    <div id="cat-view-color" class="fullscreen-paint-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; width: 95vw; max-width: 440px; margin-bottom: 4px;">
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; padding: 4px 12px; font-size: 13px;" onclick="clearColorCanvas()">مسح 🗑️</button>
        <span style="font-size: 15px; font-weight: 900; color: #78350F;">لوّن داخل الحدود!</span>
      </div>
      <canvas id="paint-canvas" class="fullscreen-canvas"></canvas>
      <div class="color-palette">
        <div class="color-dot active" style="background: #EF4444;" onclick="setColor('#EF4444', this)"></div>
        <div class="color-dot" style="background: #3B82F6;" onclick="setColor('#3B82F6', this)"></div>
        <div class="color-dot" style="background: #10B981;" onclick="setColor('#10B981', this)"></div>
        <div class="color-dot" style="background: #F59E0B;" onclick="setColor('#F59E0B', this)"></div>
        <div class="color-dot" style="background: #8B5CF6;" onclick="setColor('#8B5CF6', this)"></div>
      </div>
    </div>
  </div>

  <!-- شريط التحكم السفلي -->
  <div class="letter-selector-footer" id="letter-selector-bar" style="display: none;">
    <button class="selector-nav-btn" onclick="navLetter(-1)">◀ السابق</button>
    <div class="current-letter-display" onclick="speakCurrentLetter()">
      <span style="font-size: 14px; font-weight: 900; color: #78350F;">الحرف:</span>
      <span class="current-char-badge" id="footer-selected-char">أ</span>
      <span style="font-size: 22px;">🔊</span>
    </div>
    <button class="selector-nav-btn" onclick="navLetter(1)">التالي ▶</button>
  </div>

  <script>
    // الحروف بنطق صريح ومباشر وبدون كلمة "حرف"
    const DB = {
      ar: [
        { char: "أ", name: "أَ", word: "أرنب", emoji: "🐰", speech: "أَ .. أَرْنَبْ" },

        { char: "7", name: "سَبْعَة", word: "7 بالونات", emoji: "🎈", speech: "سَبْعَة .. سَبْع بَالُونَاتْ" },
        { char: "8", name: "تَمَانْيَة", word: "8 أزهار", emoji: "🌸", speech: "تَمَانْيَة .. تَمَانْ زُهُورْ" },
        { char: "9", name: "تِسْعَة", word: "9 كرات", emoji: "⚽", speech: "تِسْعَة .. تِسْع كُوَر" },
        { char: "10", name: "عَشَرَة", word: "10 أصابع", emoji: "🙌", speech: "عَشَرَة .. عَشَر صَوَابِعْ" }
      ]
    };

    let currentCategoryKey = 'ar';
    let currentCategoryData = [];
    let selectedLetterIndex = 0;
    let currentActiveTab = 'learn';

    function showScreen(screenId) {
      document.getElementById('screen-main').style.display = 'none';
      document.getElementById('screen-category').style.display = 'none';
      document.getElementById('letter-selector-bar').style.display = 'none';

      if(screenId === 'screen-main') {
        document.getElementById('screen-main').style.display = 'block';
      } else {
        document.getElementById(screenId).style.display = 'flex';
        document.getElementById('letter-selector-bar').style.display = 'flex';
      }
    }

    function toggleActivitiesModal() {
      document.getElementById('activities-modal').classList.toggle('active');
    }

    function selectTabFromModal(tab) {
      toggleActivitiesModal();
      switchCategoryTab(tab);
    }

    function enterCategory(key) {
      currentCategoryKey = key;
      currentCategoryData = DB[key];
      selectedLetterIndex = 0;
      showScreen('screen-category');

      const titles = { ar: 'الحروف العربية', en: 'الحروف الإنجليزية', numbers: 'الأرقام من 1 إلى 10' };
      document.getElementById('category-title').innerText = titles[key] || '';

      updateFooterLetterDisplay();
      switchCategoryTab('learn');
    }

    function navLetter(step) {
      const len = currentCategoryData.length;
      selectedLetterIndex = (selectedLetterIndex + step + len) % len;
      updateFooterLetterDisplay();
      refreshActiveActivity();
    }

    function updateFooterLetterDisplay() {
      const item = currentCategoryData[selectedLetterIndex];
      document.getElementById('footer-selected-char').innerText = item.char;
      speakCurrentLetter();
    }

    function speakCurrentLetter() {
      const item = currentCategoryData[selectedLetterIndex];
      speak(item.name, item.lang || 'ar-EG');
    }

    function refreshActiveActivity() {
      if (currentActiveTab === 'learn') renderSingleFullscreenCard();
      else if (currentActiveTab === 'write') initWritingCanvas();
      else if (currentActiveTab === 'match') startMatchingGame();
      else if (currentActiveTab === 'color') drawHugeClippedLetter();
    }

    function switchCategoryTab(tab) {
      currentActiveTab = tab;
      document.getElementById('cat-view-learn').style.display = 'none';
      document.getElementById('cat-view-write').style.display = 'none';
      document.getElementById('cat-view-match').style.display = 'none';
      document.getElementById('cat-view-color').style.display = 'none';

      if (tab === 'learn') {
        document.getElementById('cat-view-learn').style.display = 'flex';
        renderSingleFullscreenCard();
      } else if (tab === 'write') {
        document.getElementById('cat-view-write').style.display = 'block';
        initWritingCanvas();
      } else if (tab === 'match') {
        document.getElementById('cat-view-match').style.display = 'block';
        startMatchingGame();
      } else if (tab === 'color') {
        document.getElementById('cat-view-color').style.display = 'flex';
        initColoringCanvas();
      }
    }

    /* 1. عرض بطاقة واحدة بملء الشاشة */
    function renderSingleFullscreenCard() {
      const item = currentCategoryData[selectedLetterIndex];
      document.getElementById('card-hero-char').innerText = item.char;
      document.getElementById('card-hero-emoji').innerText = item.emoji;
      document.getElementById('card-hero-word').innerText = item.word;
      speak(item.speech, item.lang || 'ar-EG');
    }

    /* 2. لعبة كتابة الحرف التفاعلية مع الفحص الدقيق للخطأ */
    let writeCanvas, writeCtx, writingState = false;
    let targetLetterMaskData = null;

    function initWritingCanvas() {
      writeCanvas = document.getElementById('write-canvas');
      writeCanvas.width = writeCanvas.clientWidth * window.devicePixelRatio;
      writeCanvas.height = writeCanvas.clientHeight * window.devicePixelRatio;
      writeCtx = writeCanvas.getContext('2d');
      setupWritingEvents();
      drawLetterGuideTrace();
    }

    function drawLetterGuideTrace() {
      writeCtx.clearRect(0, 0, writeCanvas.width, writeCanvas.height);
      const item = currentCategoryData[selectedLetterIndex];

      document.getElementById('write-hero-emoji').innerText = item.emoji;
      document.getElementById('write-title-text').innerText = `اكتب (${item.name})`;

      const fontSize = Math.floor(writeCanvas.height * 0.72);
      writeCtx.font = `900 ${fontSize}px sans-serif`;
      writeCtx.textAlign = 'center';
      writeCtx.textBaseline = 'middle';

      const offCanvas = document.createElement('canvas');
      offCanvas.width = writeCanvas.width;
      offCanvas.height = writeCanvas.height;
      const offCtx = offCanvas.getContext('2d');
      offCtx.font = writeCtx.font;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = '#000000';
      offCtx.fillText(item.char, offCanvas.width / 2, offCanvas.height / 2 + 10);
      targetLetterMaskData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;

      writeCtx.lineWidth = 6;
      writeCtx.strokeStyle = '#CBD5E1';
      writeCtx.setLineDash([12, 10]);
      writeCtx.strokeText(item.char, writeCanvas.width / 2, writeCanvas.height / 2 + 10);
      writeCtx.setLineDash([]);

      speak(`يَلَّا نِكْتِبْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function clearWriteCanvas() {
      drawLetterGuideTrace();
    }

    function verifyUserHandwriting() {
      const userImg = writeCtx.getImageData(0, 0, writeCanvas.width, writeCanvas.height).data;
      let matchedPixels = 0;
      let totalLetterPixels = 0;
      let strayPixels = 0;

      for (let i = 0; i < targetLetterMaskData.length; i += 16) {
        const isLetterArea = targetLetterMaskData[i + 3] > 100;
        const isUserDrawn = userImg[i + 2] > 150;

        if (isLetterArea) totalLetterPixels++;
        if (isLetterArea && isUserDrawn) matchedPixels++;
        if (!isLetterArea && isUserDrawn) strayPixels++;
      }

      const coverageRatio = matchedPixels / (totalLetterPixels || 1);

      if (coverageRatio > 0.18 && strayPixels < matchedPixels * 1.8) {
        speak("شَاطِرْ جِدّاً! كَتَبْتَ الحَرْف صَحِيحْ! 🌟", currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
        alert("أحسنت يا بطل! كتابة صحيحة وممتازة! 🎉");
      } else {
        triggerScreenShake('cat-view-write');
        speak(`غَلَطْ! مَكَتَبْتِش ${currentCategoryData[selectedLetterIndex].name} صَحْ، حَاوِلْ تَمْشِي عَلَى النِّقَاط!`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
      }
    }

    function setupWritingEvents() {
      const getPos = e => {
        const rect = writeCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = writeCanvas.width / rect.width;
        const scaleY = writeCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const start = e => {
        writingState = true;
        writeCtx.beginPath();
        const p = getPos(e);
        writeCtx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!writingState) return;
        const p = getPos(e);
        writeCtx.strokeStyle = '#2563EB';
        writeCtx.lineWidth = 26;
        writeCtx.lineCap = 'round';
        writeCtx.lineJoin = 'round';
        writeCtx.lineTo(p.x, p.y);
        writeCtx.stroke();
      };

      const stop = () => { writingState = false; };

      writeCanvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = stop;
      writeCanvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* 3. لعبة التوصيل المباشر */
    let selectedLetterBtn = null;
    let matchPairsList = [];

    function startMatchingGame() {
      selectedLetterBtn = null;
      const rightCol = document.getElementById('match-col-right');
      const leftCol = document.getElementById('match-col-left');
      rightCol.innerHTML = '';
      leftCol.innerHTML = '';

      const targetItem = currentCategoryData[selectedLetterIndex];
      const others = currentCategoryData.filter((_, i) => i !== selectedLetterIndex).sort(() => 0.5 - Math.random()).slice(0, 2);
      matchPairsList = [targetItem, ...others].sort(() => 0.5 - Math.random());

      matchPairsList.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn';
        btn.dataset.char = item.char;
        btn.innerText = item.char;
        btn.onclick = () => onSelectMatchLetter(btn);
        rightCol.appendChild(btn);
      });

      const shuffled = [...matchPairsList].sort(() => 0.5 - Math.random());
      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn';
        btn.dataset.char = item.char;
        btn.innerHTML = `${item.emoji} <span style="font-size:14px; margin-right:4px;">${item.word}</span>`;
        btn.onclick = () => onSelectMatchTarget(btn);
        leftCol.appendChild(btn);
      });

      document.getElementById('match-instructions').innerText = `وصّل (${targetItem.name}) بالصورة المناسبة 👇`;
      speak(`فِينْ صُورَة ${targetItem.name}؟`, targetItem.lang || 'ar-EG');
    }

    function onSelectMatchLetter(btn) {
      if (btn.classList.contains('matched')) return;
      document.querySelectorAll('#match-col-right .match-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedLetterBtn = btn;
      const found = matchPairsList.find(p => p.char === btn.dataset.char);
      speak(found ? found.name : btn.dataset.char, found?.lang || 'ar-EG');
    }

    function onSelectMatchTarget(btn) {
      if (!selectedLetterBtn || btn.classList.contains('matched')) return;

      if (btn.dataset.char === selectedLetterBtn.dataset.char) {
        btn.classList.add('matched');
        selectedLetterBtn.classList.add('matched');
        selectedLetterBtn.classList.remove('selected');

        const item = matchPairsList.find(p => p.char === btn.dataset.char);
        speak(`أَحْسَنْتْ! ${item.name} .. ${item.word}`, item?.lang || 'ar-EG');
        selectedLetterBtn = null;

        const matchedCount = document.querySelectorAll('#match-col-right .matched').length;
        if (matchedCount === matchPairsList.length) {
          setTimeout(() => {
            speak(`مُمْتَازْ! يَلَّا نِوَصَّلْ ${currentCategoryData[selectedLetterIndex]?.name} مَرَّة تَانْيَة! 🎉`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
            setTimeout(startMatchingGame, 1200);
          }, 500);
        }
      } else {
        triggerShakeElement(btn);
        triggerShakeElement(selectedLetterBtn);
        speak(`غَلَطْ! فِينْ صُورَة ${currentCategoryData[selectedLetterIndex]?.name}؟`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
      }
    }

    function triggerShakeElement(el) {
      if (!el) return;
      el.classList.add('shake-error');
      setTimeout(() => el.classList.remove('shake-error'), 450);
    }

    function triggerScreenShake(containerId) {
      const el = document.getElementById(containerId);
      el.classList.add('shake-error');
      setTimeout(() => el.classList.remove('shake-error'), 450);
    }

    /* 4. تلوين الحرف العملاق */
    let colorCanvas, colorCtx, colorPainting = false;
    let currentColor = '#EF4444';

    function initColoringCanvas() {
      colorCanvas = document.getElementById('paint-canvas');
      colorCanvas.width = colorCanvas.clientWidth * window.devicePixelRatio;
      colorCanvas.height = colorCanvas.clientHeight * window.devicePixelRatio;
      colorCtx = colorCanvas.getContext('2d');
      setupFullScreenColoringEvents();
      drawHugeClippedLetter();
    }

    function drawHugeClippedLetter() {
      colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
      const item = currentCategoryData[selectedLetterIndex];
      const fontSize = Math.floor(colorCanvas.height * 0.74);
      colorCtx.font = `900 ${fontSize}px sans-serif`;
      colorCtx.textAlign = 'center';
      colorCtx.textBaseline = 'middle';

      colorCtx.fillStyle = '#F8FAFC';
      colorCtx.fillText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);

      colorCtx.lineWidth = Math.max(14, fontSize * 0.05);
      colorCtx.strokeStyle = '#CBD5E1';
      colorCtx.strokeText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);

      speak(`يَلَّا نْلَوِّنْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function clearColorCanvas() {
      drawHugeClippedLetter();
    }

    function setColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setupFullScreenColoringEvents() {
      const getPos = e => {
        const rect = colorCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = colorCanvas.width / rect.width;
        const scaleY = colorCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const start = e => {
        colorPainting = true;
        colorCtx.beginPath();
        const p = getPos(e);
        colorCtx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!colorPainting) return;
        const p = getPos(e);

        colorCtx.save();
        colorCtx.globalCompositeOperation = 'source-atop';
        colorCtx.strokeStyle = currentColor;
        colorCtx.lineWidth = Math.max(40, colorCanvas.height * 0.09);
        colorCtx.lineCap = 'round';
        colorCtx.lineJoin = 'round';
        colorCtx.lineTo(p.x, p.y);
        colorCtx.stroke();
        colorCtx.restore();

        const item = currentCategoryData[selectedLetterIndex];
        const fontSize = Math.floor(colorCanvas.height * 0.74);
        colorCtx.font = `900 ${fontSize}px sans-serif`;
        colorCtx.textAlign = 'center';
        colorCtx.textBaseline = 'middle';
        colorCtx.lineWidth = Math.max(8, fontSize * 0.04);
        colorCtx.strokeStyle = '#94A3B8';
        colorCtx.strokeText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);
      };

      const stop = () => { colorPainting = false; };

      colorCanvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = stop;
      colorCanvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* محرك النطق */
    let cachedVoices = [];
    function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, lang = 'ar-EG') {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.82; // وتيرة هادئة ونطق شديد الوضوح للطفل
      u.pitch = 1.15;

      if (lang.startsWith('ar') && cachedVoices.length > 0) {
        const eg = cachedVoices.find(v => v.lang.includes('EG') || v.name.includes('Maged') || v.name.includes('Maryam'));
        if (eg) u.voice = eg;
      }
      window.speechSynthesis.speak(u);
    }

    async function forceAppUpdate() {
      if (!navigator.onLine) return alert('يرجى الاتصال بالإنترنت أولاً لتحديث اللعبة.');
      if (confirm('تحديث اللعبة وتنزيل كل الميزات الجديدة؟')) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
    }
  </script>
</body>
</html>
