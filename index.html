<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالم الصغار السحري 🎈</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#F59E0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet" />
  <!-- مكتبة الألعاب النارية والاحتفالات للطفل -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* خلفية كرتونية متحركة بالغيوم */
    body {
      background: radial-gradient(circle at 50% 20%, #BAE6FD 0%, #7DD3FC 60%, #38BDF8 100%);
      min-height: 100vh;
      padding: 10px 10px 105px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* غيوم عائمة في الخلفية */
    .bg-cloud {
      position: fixed;
      font-size: 70px;
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
      animation: floatCloud 18s linear infinite;
    }
    @keyframes floatCloud {
      0% { transform: translateX(120vw); }
      100% { transform: translateX(-120vw); }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 8px;
      z-index: 2;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      text-shadow: 0 4px 10px rgba(14, 116, 144, 0.6);
      animation: pulseTitle 2.5s infinite ease-in-out;
    }
    @keyframes pulseTitle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .update-btn {
      background: #FFFFFF;
      border: 3px solid #0284C7;
      color: #0369A1;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0284C7;
      transition: transform 0.1s;
    }
    .update-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0284C7; }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      z-index: 2;
    }

    /* كروت رئيسية ثلاثية الأبعاد ومرنة */
    .category-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFBEB 100%);
      border: 4px solid #F59E0B;
      border-radius: 28px;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 10px 0px #D97706, 0 15px 25px rgba(217, 119, 6, 0.3);
      transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .category-card:active {
      transform: translateY(6px) scale(0.97);
      box-shadow: 0 4px 0px #D97706;
    }
    .card-icon-badge {
      font-size: 38px;
      font-weight: 900;
      color: #D97706;
      background: #FEF3C7;
      padding: 8px 20px;
      border-radius: 22px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .card-name { font-size: 23px; font-weight: 900; color: #78350F; }

    .screen-panel {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .back-btn {
      background: #EF4444;
      border: 3px solid #B91C1C;
      color: white;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 0 #991B1B;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #991B1B; }

    .activities-dropdown-btn {
      background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      border: 3px solid #1E40AF;
      color: white;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 0 #1E3A8A;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .activities-dropdown-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1E3A8A; }

    /* بطاقة كرتونية حية عائمة للطفل */
    .single-card-fullscreen {
      width: 95vw;
      max-width: 440px;
      height: 66vh;
      background: linear-gradient(180deg, #FFFFFF 0%, #FEFCE8 100%);
      border: 5px solid #F59E0B;
      border-radius: 36px;
      box-shadow: 0 12px 0 #D97706, 0 20px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px;
      margin-top: 6px;
      animation: gentleFloat 3s ease-in-out infinite alternate;
      cursor: pointer;
    }
    @keyframes gentleFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-8px) rotate(0.5deg); }
    }
    .single-card-fullscreen:active {
      transform: scale(0.96);
    }
    .hero-char-big {
      font-size: 115px;
      font-weight: 900;
      color: #1E3A8A;
      text-shadow: 0 4px 0 #93C5FD;
      line-height: 1;
    }
    .hero-emoji-big {
      font-size: 115px;
      line-height: 1;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
      animation: emojiBounce 1.8s infinite ease-in-out;
    }
    @keyframes emojiBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.08); }
    }
    .hero-word-big {
      font-size: 36px;
      font-weight: 900;
      color: #1F2937;
    }

    /* حاويات الأنشطة */
    .game-box-arcade {
      width: 100%;
      background: #FFFFFF;
      border: 4px solid #10B981;
      border-radius: 28px;
      padding: 16px 12px;
      box-shadow: 0 8px 0 #059669, 0 16px 25px rgba(5, 150, 105, 0.2);
      text-align: center;
      margin-top: 4px;
    }

    /* التوصيل التفاعلي مع تأثير الجيلي */
    .matching-board {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 48%;
    }
    .match-btn-arcade {
      background: #F8FAFC;
      border: 4px solid #3B82F6;
      border-radius: 22px;
      padding: 14px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 34px;
      font-weight: 900;
      color: #1E3A8A;
      box-shadow: 0 6px 0 #1D4ED8;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .match-btn-arcade:active { transform: scale(0.92); }
    .match-btn-arcade.selected {
      background: #FEF08A;
      border-color: #EAB308;
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 0 8px 0 #CA8A04;
    }
    .match-btn-arcade.matched {
      background: #DCFCE7 !important;
      border-color: #16A34A !important;
      color: #15803D !important;
      box-shadow: 0 5px 0 #15803D !important;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* الاهتزاز عند الخطأ */
    @keyframes arcadeShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-14px) rotate(-2deg); }
      40%, 80% { transform: translateX(14px) rotate(2deg); }
    }
    .shake-error {
      animation: arcadeShake 0.45s ease-in-out;
      border-color: #EF4444 !important;
      background: #FEE2E2 !important;
    }

    /* نافذة الألعاب المنبثقة */
    .activities-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10000;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .activities-modal.active { display: flex; }
    .activities-sheet {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      border-radius: 32px 32px 0 0;
      padding: 22px 18px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
      animation: slideUpSheet 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideUpSheet {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
    .modal-game-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 18px;
      border: 3px solid #E2E8F0;
      background: #F8FAFC;
      font-size: 18px;
      font-weight: 900;
      color: #1E293B;
      cursor: pointer;
      width: 100%;
      text-align: right;
      transition: all 0.15s;
    }
    .modal-game-item:active {
      transform: scale(0.97);
      background: #FEF3C7;
      border-color: #F59E0B;
    }

    /* لوحة التلوين */
    .fullscreen-paint-box {
      width: 100vw;
      height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .fullscreen-canvas {
      width: 95vw;
      max-width: 440px;
      height: 60vh;
      background: #FFFFFF;
      border: 5px solid #F59E0B;
      border-radius: 28px;
      box-shadow: 0 10px 0 #D97706;
      touch-action: none;
    }
    .color-palette {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      justify-content: center;
    }
    .color-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .color-dot.active { transform: scale(1.22); border-color: #111; }

    /* لوحة كتابة الحرف */
    .write-canvas-arcade {
      width: 92vw;
      max-width: 420px;
      height: 48vh;
      background: #FFFFFF;
      border: 4px dashed #60A5FA;
      border-radius: 24px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.04);
      touch-action: none;
      margin-top: 8px;
    }

    /* شريط التحكم السفلي */
    .letter-selector-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border-top: 4px solid #F59E0B;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.12);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 9999;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 24px 24px 0 0;
    }
    .selector-nav-btn {
      background: #EFF6FF;
      border: 3px solid #3B82F6;
      border-radius: 18px;
      padding: 8px 18px;
      font-size: 18px;
      font-weight: 900;
      color: #1D4ED8;
      cursor: pointer;
      box-shadow: 0 4px 0 #2563EB;
      transition: transform 0.1s;
    }
    .selector-nav-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2563EB; }
    .current-letter-display {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FEF3C7;
      border: 3px solid #F59E0B;
      border-radius: 20px;
      padding: 4px 16px;
      cursor: pointer;
    }
    .current-char-badge {
      font-size: 34px;
      font-weight: 900;
      color: #D97706;
    }
  </style>
</head>
<body>

  <!-- غيوم عائمة حية تسبح في الخلفية -->
  <div class="bg-cloud" style="top: 8%; animation-duration: 26s;">☁️</div>
  <div class="bg-cloud" style="top: 25%; animation-duration: 34s; animation-delay: -10s;">☁️</div>
  <div class="bg-cloud" style="top: 55%; animation-duration: 22s; animation-delay: -5s;">☁️</div>

  <!-- القائمة الرئيسية -->
  <div id="screen-main" style="width: 100%; max-width: 500px;">
    <div class="top-bar">
      <div class="app-title">🎈 عالم الأذكياء السحري</div>
      <button class="update-btn" onclick="forceAppUpdate()">🔄 تحديث اللعبة</button>
    </div>
    
    <div class="menu-grid">
      <div class="category-card" onclick="enterCategory('ar')">
        <div class="card-name">الحروف العربية والمرح</div>
        <span class="card-icon-badge">أ ب ت</span>
      </div>
      <div class="category-card" onclick="enterCategory('en')">
        <div class="card-name">الحروف الإنجليزية للأبطال</div>
        <span class="card-icon-badge">A B C</span>
      </div>
      <div class="category-card" onclick="enterCategory('numbers')">
        <div class="card-name">الأرقام والمغامرات (1-10)</div>
        <span class="card-icon-badge">١ ٢ ٣</span>
      </div>
    </div>
  </div>

  <!-- شاشة القسم المختار -->
  <div id="screen-category" class="screen-panel">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 6px;">
      <button class="back-btn" onclick="showScreen('screen-main'); sfxClick();">🔙 القائمة</button>
      <div id="category-title" style="font-size: 19px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.3);"></div>
      <button class="activities-dropdown-btn" onclick="toggleActivitiesModal(); sfxClick();">🎯 قائمة الألعاب ▾</button>
    </div>

    <!-- نافذة الألعاب المنبثقة الشاملة -->
    <div id="activities-modal" class="activities-modal" onclick="toggleActivitiesModal()">
      <div class="activities-sheet" onclick="event.stopPropagation()">
        <div style="font-size: 20px; font-weight: 900; color: #1E293B; margin-bottom: 14px; text-align: center;">اخْتَارِ اللُّعْبَة المُمْتِعَة 🎮</div>
        <button class="modal-game-item" onclick="selectTabFromModal('learn')">📖 بطاقة الحرف الكبيرة</button>
        <button class="modal-game-item" onclick="selectTabFromModal('write')">✍️ اكتب الحرف وافحص خطك</button>
        <button class="modal-game-item" onclick="selectTabFromModal('match')">🎯 توصيل مكثف للحرف</button>
        <button class="modal-game-item" onclick="selectTabFromModal('color')">🎨 تلوين الحرف العملاق</button>
        <button class="back-btn" style="width: 100%; margin-top: 10px; border-radius: 16px; padding: 10px;" onclick="toggleActivitiesModal()">إلغاء ✕</button>
      </div>
    </div>

    <!-- 1. البطاقة الكبيرة العائمة بملء الشاشة -->
    <div id="cat-view-learn" class="single-card-fullscreen" onclick="speakCurrentLetter(); sfxPop();">
      <div class="hero-char-big" id="card-hero-char">أ</div>
      <div class="hero-emoji-big" id="card-hero-emoji">🐰</div>
      <div class="hero-word-big" id="card-hero-word">أرنب</div>
      <div style="font-size: 17px; font-weight: 900; color: #B45309; background: #FEF3C7; padding: 8px 24px; border-radius: 24px; box-shadow: 0 3px 0 #F59E0B;">🔊 اضغط لسماع الصوت</div>
    </div>

    <!-- 2. لعبة الكتابة التفاعلية -->
    <div id="cat-view-write" class="game-box-arcade" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 40px;" id="write-hero-emoji">🐰</span>
        <span style="font-size: 20px; font-weight: 900; color: #1E3A8A;" id="write-title-text">اكتب الحرف بإصبعك</span>
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; padding: 4px 12px; font-size: 13px;" onclick="clearWriteCanvas(); sfxClick();">مسح 🗑️</button>
      </div>
      <canvas id="write-canvas" class="write-canvas-arcade"></canvas>
      <button class="back-btn" style="background: #10B981; border-color: #059669; width: 100%; margin-top: 8px; padding: 12px; font-size: 18px;" onclick="verifyUserHandwriting()">تأكيد الرسمة وفحص الحرف ✅</button>
    </div>

    <!-- 3. شاشة التوصيل المكثف -->
    <div id="cat-view-match" class="game-box-arcade" style="display: none;">
      <div style="font-size: 19px; font-weight: 900; color: #065F46;" id="match-instructions">وصّل بالصورة المناسبة 👇</div>
      <div class="matching-board" id="matching-board-container">
        <div class="match-col" id="match-col-right"></div>
        <div class="match-col" id="match-col-left"></div>
      </div>
    </div>

    <!-- 4. شاشة التلوين العملاقة -->
    <div id="cat-view-color" class="fullscreen-paint-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; width: 95vw; max-width: 440px; margin-bottom: 4px;">
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; padding: 4px 12px; font-size: 13px;" onclick="clearColorCanvas(); sfxClick();">مسح 🗑️</button>
        <span style="font-size: 16px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">لوّن داخل الحدود!</span>
      </div>
      <canvas id="paint-canvas" class="fullscreen-canvas"></canvas>
      <div class="color-palette">
        <div class="color-dot active" style="background: #EF4444;" onclick="setColor('#EF4444', this)"></div>
        <div class="color-dot" style="background: #3B82F6;" onclick="setColor('#3B82F6', this)"></div>
        <div class="color-dot" style="background: #10B981;" onclick="setColor('#10B981', this)"></div>
        <div class="color-dot" style="background: #F59E0B;" onclick="setColor('#F59E0B', this)"></div>
        <div class="color-dot" style="background: #8B5CF6;" onclick="setColor('#8B5CF6', this)"></div>
      </div>
    </div>
  </div>

  <!-- شريط التحكم السفلي -->
  <div class="letter-selector-footer" id="letter-selector-bar" style="display: none;">
    <button class="selector-nav-btn" onclick="navLetter(-1)">◀ السابق</button>
    <div class="current-letter-display" onclick="speakCurrentLetter(); sfxPop();">
      <span style="font-size: 14px; font-weight: 900; color: #78350F;">الحرف:</span>
      <span class="current-char-badge" id="footer-selected-char">أ</span>
      <span style="font-size: 24px;">🔊</span>
    </div>
    <button class="selector-nav-btn" onclick="navLetter(1)">التالي ▶</button>
  </div>

  <script>
    /* ================= 1. محرك المؤثرات الصوتية الكرتونية (Web Audio API) ================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration, delay = 0) {
      setTimeout(() => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, delay);
    }

    function sfxPop() {
      // نغمة فقاعة مبهجة
      playTone(400, 'sine', 0.1);
      playTone(800, 'sine', 0.15, 60);
    }

    function sfxSuccess() {
      // نغمة فوز واحتفال كرتونية متصاعدة
      playTone(523.25, 'triangle', 0.15, 0);   // C5
      playTone(659.25, 'triangle', 0.15, 120); // E5
      playTone(783.99, 'triangle', 0.15, 240); // G5
      playTone(1046.50, 'triangle', 0.35, 360); // C6
      // إطلاق ألعاب نارية ونجوم متناثرة
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 60,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function sfxError() {
      // نغمة خطأ طفولية خفيفة
      playTone(220, 'sawtooth', 0.25);
      playTone(180, 'sawtooth', 0.25, 150);
    }

    function sfxClick() {
      playTone(600, 'sine', 0.05);
    }

    /* ================= 2. البيانات والنطق الصريح ================= */
    const DB = {
      ar: [
        { char: "أ", name: "أَ", word: "أرنب", emoji: "🐰", speech: "أَ .. أَرْنَبْ" },

      ],
      numbers: [
        { char: "1", name: "وَاحِدْ", word: "شمس واحدة", emoji: "☀️", speech: "وَاحِدْ .. شَمْس وَاحْدَة" },
        { char: "2", name: "اِتْنِينْ", word: "عينان اثنتان", emoji: "👀", speech: "اِتْنِينْ .. عِينَيَّا الاِتْنِينْ" },
        { char: "3", name: "تَلاَتَة", word: "3 تفاحات", emoji: "🍎", speech: "تَلاَتَة .. تَلاَتْ تُفَّاحَاتْ" },
        { char: "4", name: "أَرْبَعَة", word: "4 فراشات", emoji: "🦋", speech: "أَرْبَعَة .. أَرْبَعْ فَرَاشَاتْ" },
        { char: "5", name: "خَمْسَة", word: "5 أصابع", emoji: "✋", speech: "خَمْسَة .. خَمْس صَوَابِعْ" },
        { char: "6", name: "سِتَّة", word: "6 نجوم", emoji: "⭐", speech: "سِتَّة .. سِتْ نُجُومْ" },
        { char: "7", name: "سَبْعَة", word: "7 بالونات", emoji: "🎈", speech: "سَبْعَة .. سَبْع بَالُونَاتْ" },
        { char: "8", name: "تَمَانْيَة", word: "8 أزهار", emoji: "🌸", speech: "تَمَانْيَة .. تَمَانْ زُهُورْ" },
        { char: "9", name: "تِسْعَة", word: "9 كرات", emoji: "⚽", speech: "تِسْعَة .. تِسْع كُوَر" },
        { char: "10", name: "عَشَرَة", word: "10 أصابع", emoji: "🙌", speech: "عَشَرَة .. عَشَر صَوَابِعْ" }
      ]
    };

    let currentCategoryKey = 'ar';
    let currentCategoryData = [];
    let selectedLetterIndex = 0;
    let currentActiveTab = 'learn';

    function showScreen(screenId) {
      document.getElementById('screen-main').style.display = 'none';
      document.getElementById('screen-category').style.display = 'none';
      document.getElementById('letter-selector-bar').style.display = 'none';

      if(screenId === 'screen-main') {
        document.getElementById('screen-main').style.display = 'block';
      } else {
        document.getElementById(screenId).style.display = 'flex';
        document.getElementById('letter-selector-bar').style.display = 'flex';
      }
    }

    function toggleActivitiesModal() {
      document.getElementById('activities-modal').classList.toggle('active');
    }

    function selectTabFromModal(tab) {
      toggleActivitiesModal();
      sfxClick();
      switchCategoryTab(tab);
    }

    function enterCategory(key) {
      sfxPop();
      currentCategoryKey = key;
      currentCategoryData = DB[key];
      selectedLetterIndex = 0;
      showScreen('screen-category');

      const titles = { ar: 'الحروف العربية', en: 'الحروف الإنجليزية', numbers: 'الأرقام من 1 إلى 10' };
      document.getElementById('category-title').innerText = titles[key] || '';

      updateFooterLetterDisplay();
      switchCategoryTab('learn');
    }

    function navLetter(step) {
      sfxClick();
      const len = currentCategoryData.length;
      selectedLetterIndex = (selectedLetterIndex + step + len) % len;
      updateFooterLetterDisplay();
      refreshActiveActivity();
    }

    function updateFooterLetterDisplay() {
      const item = currentCategoryData[selectedLetterIndex];
      document.getElementById('footer-selected-char').innerText = item.char;
      speakCurrentLetter();
    }

    function speakCurrentLetter() {
      const item = currentCategoryData[selectedLetterIndex];
      speak(item.name, item.lang || 'ar-EG');
    }

    function refreshActiveActivity() {
      if (currentActiveTab === 'learn') renderSingleFullscreenCard();
      else if (currentActiveTab === 'write') initWritingCanvas();
      else if (currentActiveTab === 'match') startMatchingGame();
      else if (currentActiveTab === 'color') drawHugeClippedLetter();
    }

    function switchCategoryTab(tab) {
      currentActiveTab = tab;
      document.getElementById('cat-view-learn').style.display = 'none';
      document.getElementById('cat-view-write').style.display = 'none';
      document.getElementById('cat-view-match').style.display = 'none';
      document.getElementById('cat-view-color').style.display = 'none';

      if (tab === 'learn') {
        document.getElementById('cat-view-learn').style.display = 'flex';
        renderSingleFullscreenCard();
      } else if (tab === 'write') {
        document.getElementById('cat-view-write').style.display = 'block';
        initWritingCanvas();
      } else if (tab === 'match') {
        document.getElementById('cat-view-match').style.display = 'block';
        startMatchingGame();
      } else if (tab === 'color') {
        document.getElementById('cat-view-color').style.display = 'flex';
        initColoringCanvas();
      }
    }

    /* 1. عرض بطاقة واحدة بملء الشاشة */
    function renderSingleFullscreenCard() {
      const item = currentCategoryData[selectedLetterIndex];
      document.getElementById('card-hero-char').innerText = item.char;
      document.getElementById('card-hero-emoji').innerText = item.emoji;
      document.getElementById('card-hero-word').innerText = item.word;
      speak(item.speech, item.lang || 'ar-EG');
    }

    /* 2. لعبة كتابة الحرف التفاعلية مع الفحص الحقيقي للخطأ */
    let writeCanvas, writeCtx, writingState = false;
    let targetLetterMaskData = null;

    function initWritingCanvas() {
      writeCanvas = document.getElementById('write-canvas');
      writeCanvas.width = writeCanvas.clientWidth * window.devicePixelRatio;
      writeCanvas.height = writeCanvas.clientHeight * window.devicePixelRatio;
      writeCtx = writeCanvas.getContext('2d');
      setupWritingEvents();
      drawLetterGuideTrace();
    }

    function drawLetterGuideTrace() {
      writeCtx.clearRect(0, 0, writeCanvas.width, writeCanvas.height);
      const item = currentCategoryData[selectedLetterIndex];

      document.getElementById('write-hero-emoji').innerText = item.emoji;
      document.getElementById('write-title-text').innerText = `اكتب (${item.name})`;

      const fontSize = Math.floor(writeCanvas.height * 0.72);
      writeCtx.font = `900 ${fontSize}px sans-serif`;
      writeCtx.textAlign = 'center';
      writeCtx.textBaseline = 'middle';

      const offCanvas = document.createElement('canvas');
      offCanvas.width = writeCanvas.width;
      offCanvas.height = writeCanvas.height;
      const offCtx = offCanvas.getContext('2d');
      offCtx.font = writeCtx.font;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = '#000000';
      offCtx.fillText(item.char, offCanvas.width / 2, offCanvas.height / 2 + 10);
      targetLetterMaskData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;

      writeCtx.lineWidth = 6;
      writeCtx.strokeStyle = '#CBD5E1';
      writeCtx.setLineDash([12, 10]);
      writeCtx.strokeText(item.char, writeCanvas.width / 2, writeCanvas.height / 2 + 10);
      writeCtx.setLineDash([]);

      speak(`يَلَّا نِكْتِبْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function clearWriteCanvas() {
      drawLetterGuideTrace();
    }

    function verifyUserHandwriting() {
      const userImg = writeCtx.getImageData(0, 0, writeCanvas.width, writeCanvas.height).data;
      let matchedPixels = 0;
      let totalLetterPixels = 0;
      let strayPixels = 0;

      for (let i = 0; i < targetLetterMaskData.length; i += 16) {
        const isLetterArea = targetLetterMaskData[i + 3] > 100;
        const isUserDrawn = userImg[i + 2] > 150; // بكسل أزرق

        if (isLetterArea) totalLetterPixels++;
        if (isLetterArea && isUserDrawn) matchedPixels++;
        if (!isLetterArea && isUserDrawn) strayPixels++;
      }

      const coverageRatio = matchedPixels / (totalLetterPixels || 1);

      if (coverageRatio > 0.18 && strayPixels < matchedPixels * 1.8) {
        sfxSuccess();
        speak("شَاطِرْ جِدّاً! كَتَبْتَ الحَرْف صَحِيحْ! 🌟", currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
        alert("أحسنت يا بطل! كتابة صحيحة وممتازة! 🎉");
      } else {
        sfxError();
        triggerScreenShake('cat-view-write');
        speak(`غَلَطْ! مَكَتَبْتِش ${currentCategoryData[selectedLetterIndex].name} صَحْ، حَاوِلْ تَمْشِي عَلَى النِّقَاط!`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
      }
    }

    function setupWritingEvents() {
      const getPos = e => {
        const rect = writeCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = writeCanvas.width / rect.width;
        const scaleY = writeCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const start = e => {
        writingState = true;
        writeCtx.beginPath();
        const p = getPos(e);
        writeCtx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!writingState) return;
        const p = getPos(e);
        writeCtx.strokeStyle = '#2563EB';
        writeCtx.lineWidth = 26;
        writeCtx.lineCap = 'round';
        writeCtx.lineJoin = 'round';
        writeCtx.lineTo(p.x, p.y);
        writeCtx.stroke();
      };

      const stop = () => { writingState = false; };

      writeCanvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = stop;
      writeCanvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* 3. لعبة التوصيل المباشر */
    let selectedLetterBtn = null;
    let matchPairsList = [];

    function startMatchingGame() {
      selectedLetterBtn = null;
      const rightCol = document.getElementById('match-col-right');
      const leftCol = document.getElementById('match-col-left');
      rightCol.innerHTML = '';
      leftCol.innerHTML = '';

      const targetItem = currentCategoryData[selectedLetterIndex];
      const others = currentCategoryData.filter((_, i) => i !== selectedLetterIndex).sort(() => 0.5 - Math.random()).slice(0, 2);
      matchPairsList = [targetItem, ...others].sort(() => 0.5 - Math.random());

      matchPairsList.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn-arcade';
        btn.dataset.char = item.char;
        btn.innerText = item.char;
        btn.onclick = () => onSelectMatchLetter(btn);
        rightCol.appendChild(btn);
      });

      const shuffled = [...matchPairsList].sort(() => 0.5 - Math.random());
      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn-arcade';
        btn.dataset.char = item.char;
        btn.innerHTML = `${item.emoji} <span style="font-size:15px; margin-right:4px;">${item.word}</span>`;
        btn.onclick = () => onSelectMatchTarget(btn);
        leftCol.appendChild(btn);
      });

      document.getElementById('match-instructions').innerText = `وصّل (${targetItem.name}) بالصورة المناسبة 👇`;
      speak(`فِينْ صُورَة ${targetItem.name}؟`, targetItem.lang || 'ar-EG');
    }

    function onSelectMatchLetter(btn) {
      if (btn.classList.contains('matched')) return;
      sfxPop();
      document.querySelectorAll('#match-col-right .match-btn-arcade').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedLetterBtn = btn;
      const found = matchPairsList.find(p => p.char === btn.dataset.char);
      speak(found ? found.name : btn.dataset.char, found?.lang || 'ar-EG');
    }

    function onSelectMatchTarget(btn) {
      if (!selectedLetterBtn || btn.classList.contains('matched')) return;

      if (btn.dataset.char === selectedLetterBtn.dataset.char) {
        sfxSuccess();
        btn.classList.add('matched');
        selectedLetterBtn.classList.add('matched');
        selectedLetterBtn.classList.remove('selected');

        const item = matchPairsList.find(p => p.char === btn.dataset.char);
        speak(`أَحْسَنْتْ! ${item.name} .. ${item.word}`, item?.lang || 'ar-EG');
        selectedLetterBtn = null;

        const matchedCount = document.querySelectorAll('#match-col-right .matched').length;
        if (matchedCount === matchPairsList.length) {
          setTimeout(() => {
            speak(`مُمْتَازْ! يَلَّا نِوَصَّلْ ${currentCategoryData[selectedLetterIndex]?.name} مَرَّة تَانْيَة! 🎉`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
            setTimeout(startMatchingGame, 1200);
          }, 500);
        }
      } else {
        sfxError();
        triggerShakeElement(btn);
        triggerShakeElement(selectedLetterBtn);
        speak(`غَلَطْ! فِينْ صُورَة ${currentCategoryData[selectedLetterIndex]?.name}؟`, currentCategoryData[selectedLetterIndex]?.lang || 'ar-EG');
      }
    }

    function triggerShakeElement(el) {
      if (!el) return;
      el.classList.add('shake-error');
      setTimeout(() => el.classList.remove('shake-error'), 450);
    }

    function triggerScreenShake(containerId) {
      const el = document.getElementById(containerId);
      el.classList.add('shake-error');
      setTimeout(() => el.classList.remove('shake-error'), 450);
    }

    /* 4. تلوين الحرف العملاق */
    let colorCanvas, colorCtx, colorPainting = false;
    let currentColor = '#EF4444';

    function initColoringCanvas() {
      colorCanvas = document.getElementById('paint-canvas');
      colorCanvas.width = colorCanvas.clientWidth * window.devicePixelRatio;
      colorCanvas.height = colorCanvas.clientHeight * window.devicePixelRatio;
      colorCtx = colorCanvas.getContext('2d');
      setupFullScreenColoringEvents();
      drawHugeClippedLetter();
    }

    function drawHugeClippedLetter() {
      colorCtx.clearRect(0, 0, colorCanvas.width, colorCanvas.height);
      const item = currentCategoryData[selectedLetterIndex];
      const fontSize = Math.floor(colorCanvas.height * 0.74);
      colorCtx.font = `900 ${fontSize}px sans-serif`;
      colorCtx.textAlign = 'center';
      colorCtx.textBaseline = 'middle';

      colorCtx.fillStyle = '#F8FAFC';
      colorCtx.fillText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);

      colorCtx.lineWidth = Math.max(14, fontSize * 0.05);
      colorCtx.strokeStyle = '#CBD5E1';
      colorCtx.strokeText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);

      speak(`يَلَّا نْلَوِّنْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function clearColorCanvas() {
      drawHugeClippedLetter();
    }

    function setColor(color, el) {
      sfxClick();
      currentColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setupFullScreenColoringEvents() {
      const getPos = e => {
        const rect = colorCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = colorCanvas.width / rect.width;
        const scaleY = colorCanvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const start = e => {
        colorPainting = true;
        colorCtx.beginPath();
        const p = getPos(e);
        colorCtx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!colorPainting) return;
        const p = getPos(e);

        colorCtx.save();
        colorCtx.globalCompositeOperation = 'source-atop';
        colorCtx.strokeStyle = currentColor;
        colorCtx.lineWidth = Math.max(40, colorCanvas.height * 0.09);
        colorCtx.lineCap = 'round';
        colorCtx.lineJoin = 'round';
        colorCtx.lineTo(p.x, p.y);
        colorCtx.stroke();
        colorCtx.restore();

        const item = currentCategoryData[selectedLetterIndex];
        const fontSize = Math.floor(colorCanvas.height * 0.74);
        colorCtx.font = `900 ${fontSize}px sans-serif`;
        colorCtx.textAlign = 'center';
        colorCtx.textBaseline = 'middle';
        colorCtx.lineWidth = Math.max(8, fontSize * 0.04);
        colorCtx.strokeStyle = '#94A3B8';
        colorCtx.strokeText(item.char, colorCanvas.width / 2, colorCanvas.height / 2 + 15);
      };

      const stop = () => { colorPainting = false; };

      colorCanvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = stop;
      colorCanvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* محرك النطق */
    let cachedVoices = [];
    function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, lang = 'ar-EG') {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.82;
      u.pitch = 1.15;

      if (lang.startsWith('ar') && cachedVoices.length > 0) {
        const eg = cachedVoices.find(v => v.lang.includes('EG') || v.name.includes('Maged') || v.name.includes('Maryam'));
        if (eg) u.voice = eg;
      }
      window.speechSynthesis.speak(u);
    }

    async function forceAppUpdate() {
      if (!navigator.onLine) return alert('يرجى الاتصال بالإنترنت أولاً لتحديث اللعبة.');
      if (confirm('تحديث اللعبة وتنزيل كل الميزات والمؤثرات الجديدة؟')) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
    }
  </script>
