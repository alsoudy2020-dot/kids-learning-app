<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالم الصغار التعليمي 🎈</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#F59E0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(180deg, #FDE68A 0%, #FEF3C7 100%);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 14px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 900;
      color: #D97706;
      text-shadow: 2px 2px #fff;
    }
    .update-btn {
      background: #FFFFFF;
      border: 2px solid #D97706;
      color: #B45309;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #D97706;
    }

    /* أزرار القائمة الرئيسية */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    .category-card {
      background: #FFFFFF;
      border: 4px solid #F59E0B;
      border-radius: 24px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 0px #D97706;
    }
    .category-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #D97706; }
    .card-icon { font-size: 46px; margin-bottom: 6px; }
    .card-icon-text { font-size: 34px; font-weight: 900; color: #D97706; margin-bottom: 4px; }
    .card-name { font-size: 18px; font-weight: 900; color: #78350F; }

    /* شريط الأنشطة المدمجة داخل كل قسم */
    .section-activities-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .activity-tab-btn {
      flex: 1;
      min-width: 85px;
      background: #FFFFFF;
      border: 3px solid #3B82F6;
      border-radius: 16px;
      padding: 8px 4px;
      font-size: 14px;
      font-weight: 900;
      color: #1D4ED8;
      box-shadow: 0 4px 0 #2563EB;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .activity-tab-btn.active {
      background: #3B82F6;
      color: white;
    }

    .screen-panel {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
    }

    .back-btn {
      align-self: flex-start;
      background: #EF4444;
      border: 3px solid #B91C1C;
      color: white;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 18px;
      box-shadow: 0 4px 0 #991B1B;
      cursor: pointer;
      margin-bottom: 10px;
    }

    /* شبكة الحروف */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      padding: 4px;
    }
    .item-card {
      background: white;
      border: 3px solid #3B82F6;
      border-radius: 18px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 5px 0 #1D4ED8;
      cursor: pointer;
    }
    .item-card:active { transform: scale(0.92); }
    .item-char { font-size: 34px; font-weight: 900; color: #1E3A8A; }
    .item-emoji { font-size: 34px; margin: 2px 0; }
    .item-word { font-size: 15px; font-weight: 900; color: #4B5563; }

    /* صناديق الألعاب المدمجة */
    .game-box {
      width: 100%;
      background: white;
      border: 4px solid #10B981;
      border-radius: 22px;
      padding: 20px 14px;
      box-shadow: 0 6px 0 #059669;
      text-align: center;
      margin-top: 6px;
    }
    .game-title {
      font-size: 22px;
      font-weight: 900;
      color: #065F46;
      margin-bottom: 14px;
    }
    .game-options-row {
      display: flex;
      justify-content: space-around;
      gap: 8px;
    }
    .game-choice-btn {
      flex: 1;
      background: #EFF6FF;
      border: 3px solid #3B82F6;
      border-radius: 18px;
      padding: 14px 6px;
      font-size: 34px;
      font-weight: 900;
      color: #1D4ED8;
      box-shadow: 0 5px 0 #2563EB;
      cursor: pointer;
    }
    .game-choice-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2563EB; }

    /* لوحة التلوين */
    .color-palette {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .color-dot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .color-dot.active { transform: scale(1.15); border-color: #111; }
    #paint-canvas {
      background: white;
      border: 4px solid #F59E0B;
      border-radius: 20px;
      box-shadow: 0 6px 0 #D97706;
      touch-action: none;
    }
  </style>
</head>
<body>

  <!-- القائمة الرئيسية -->
  <div id="screen-main" style="width: 100%; max-width: 500px;">
    <div class="top-bar">
      <div class="app-title">🎈 عالم الأذكياء الصغار</div>
      <button class="update-btn" onclick="forceAppUpdate()">🔄 تحديث اللعبة</button>
    </div>
    
    <div class="menu-grid">
      <div class="category-card" onclick="enterCategory('ar')">
        <span class="card-icon-text">أ ب ت</span>
        <span class="card-name">الحروف العربية وألعابها</span>
      </div>
      <div class="category-card" onclick="enterCategory('en')">
        <span class="card-icon">🔠</span>
        <span class="card-name">الحروف الإنجليزية وألعابها</span>
      </div>
      <div class="category-card" onclick="enterCategory('numbers')">
        <span class="card-icon">🔢</span>
        <span class="card-name">الأرقام وألعاب العد</span>
      </div>
      <div class="category-card" onclick="enterCategory('animals')">
        <span class="card-icon">🦁</span>
        <span class="card-name">عالم الحيوانات</span>
      </div>
    </div>
  </div>

  <!-- شاشة القسم المتكامل (حروف/أرقام + ألعابها) -->
  <div id="screen-category" class="screen-panel">
    <div style="display: flex; justify-content: space-between; width: 100%;">
      <button class="back-btn" onclick="showScreen('screen-main')">🔙 القائمة</button>
      <div id="category-title" style="font-size: 18px; font-weight: 900; color: #78350F;"></div>
    </div>

    <!-- شريط الأنشطة المدمجة داخل هذا القسم -->
    <div class="section-activities-bar">
      <div class="activity-tab-btn active" id="tab-learn" onclick="switchCategoryTab('learn')">📖 الحروف</div>
      <div class="activity-tab-btn" id="tab-find" onclick="switchCategoryTab('find')">🧐 فين الحرف؟</div>
      <div class="activity-tab-btn" id="tab-match" onclick="switchCategoryTab('match')">🎯 وصّل الحرف</div>
      <div class="activity-tab-btn" id="tab-color" onclick="switchCategoryTab('color')">🎨 لوّن الحرف</div>
    </div>

    <!-- 1. لوحة الحروف والاستماع -->
    <div id="cat-view-learn" class="board-grid"></div>

    <!-- 2. لعبة: فين الحرف؟ -->
    <div id="cat-view-find" class="game-box" style="display: none;">
      <div class="game-title" id="find-game-title">فين الحرف؟</div>
      <button class="back-btn" style="background: #3B82F6; border-color: #1D4ED8; box-shadow: 0 3px 0 #1E40AF; margin-bottom: 16px;" onclick="repeatFindAudio()">🔊 اسمع اسم الحرف تاني</button>
      <div class="game-options-row" id="find-options-container"></div>
    </div>

    <!-- 3. لعبة: وصّل الحرف بالصورة -->
    <div id="cat-view-match" class="game-box" style="display: none;">
      <div class="game-title" id="match-game-title">ما هي الكلمة التي تبدأ بهذا الحرف؟</div>
      <div style="font-size: 60px; font-weight: 900; color: #2563EB; margin: 10px 0;" id="match-target-char">أ</div>
      <div class="game-options-row" id="match-options-container"></div>
    </div>

    <!-- 4. نشاط التلوين للحرف المختار -->
    <div id="cat-view-color" style="display: none; flex-direction: column; align-items: center; width: 100%;">
      <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 8px;">
        <button class="back-btn" style="background: #3B82F6; border-color: #1D4ED8; box-shadow: 0 3px 0 #1E40AF; margin: 0;" onclick="nextColoringChar()">حرف تاني ↻</button>
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; box-shadow: 0 3px 0 #B45309; margin: 0;" onclick="clearCanvas()">مسح 🗑️</button>
      </div>
      <div class="color-palette">
        <div class="color-dot active" style="background: #EF4444;" onclick="setColor('#EF4444', this)"></div>
        <div class="color-dot" style="background: #3B82F6;" onclick="setColor('#3B82F6', this)"></div>
        <div class="color-dot" style="background: #10B981;" onclick="setColor('#10B981', this)"></div>
        <div class="color-dot" style="background: #F59E0B;" onclick="setColor('#F59E0B', this)"></div>
        <div class="color-dot" style="background: #8B5CF6;" onclick="setColor('#8B5CF6', this)"></div>
      </div>
      <canvas id="paint-canvas" width="320" height="320"></canvas>
    </div>
  </div>

  <script>
    // قاعدة البيانات مع كتابة اسم الحرف الكامل بدقة لنطق مصري سليم
    const DB = {
      ar: [
        { char: "أ", name: "حَرْف الأَلِفْ", word: "أرنب", emoji: "🐰", speech: "أَلِفْ .. أَرْنَبْ بِيْطَفْطَفْ" },
        { char: "ب", name: "حَرْف البَاءْ", word: "بطة", emoji: "🦆", speech: "بَاءْ .. بَطَّة بْتِعُومْ فِي المَيَّة" },
        { char: "ت", name: "حَرْف التَّاءْ", word: "تفاح", emoji: "🍎", speech: "تَاءْ .. تُفَّاحْ أَحْمَرْ لَذِيذْ" },
        { char: "ث", name: "حَرْف الثَّاءْ", word: "ثعلب", emoji: "🦊", speech: "ثَاءْ .. ثَعْلَبْ مَكَّارْ" },
        { char: "ج", name: "حَرْف الجِيمْ", word: "جمل", emoji: "🐪", speech: "جِيمْ .. جَمَلْ سَفِينَة الصَّحْرَا" },
        { char: "ح", name: "حَرْف الحَاءْ", word: "حصان", emoji: "🐴", speech: "حَاءْ .. حُصَانْ سَرِيعْ بِيِجْرِي" },
        { char: "خ", name: "حَرْف الخَاءْ", word: "خروف", emoji: "🐑", sound: "خَاءْ .. خَرُوفْ حُلْو وَوَدِيعْ" },
        { char: "د", name: "حَرْف الدَّالْ", word: "دب", emoji: "🐻", speech: "دَالْ .. دُبْ كِبِيرْ" },
        { char: "ذ", name: "حَرْف الذَّالْ", word: "ذرة", emoji: "🌽", speech: "ذَالْ .. ذُرَة صَفْرَا طَعْمَهَا حُلْو" },
        { char: "ر", name: "حَرْف الرَّاءْ", word: "ريشة", emoji: "🪶", speech: "رَاءْ .. رِيشَة خَفِيفَة جِدّاً" },
        { char: "ز", name: "حَرْف الزَّايْ", word: "زرافة", emoji: "🦒", speech: "زَايْ .. زَرَافَة رَقَبِتْهَا طَوِيلَة" },
        { char: "س", name: "حَرْف السِّينْ", word: "سمكة", emoji: "🐟", speech: "سِينْ .. سَمَكَة عَمَّالَة تِعُومْ" },
        { char: "ش", name: "حَرْف الشِّينْ", word: "شمس", emoji: "☀️", speech: "شِينْ .. شَمْس دَافْيَة وَمُنَوَّرَة" },
        { char: "ص", name: "حَرْف الصَّادْ", word: "صقر", emoji: "🦅", speech: "صَادْ .. صَقْر طَايِرْ فِي السَّمَا" },
        { char: "ض", name: "حَرْف الضَّادْ", word: "ضفدع", emoji: "🐸", speech: "ضَادْ .. ضِفْدَعْ بِيْنُطْ" },
        { char: "ط", name: "حَرْف الطَّاءْ", word: "طيارة", emoji: "✈️", speech: "طَاءْ .. طَيَّارَة فُوقْ فِي الجَوّ" },
        { char: "ظ", name: "حَرْف الظَّاءْ", word: "ظرف", emoji: "✉️", speech: "ظَاءْ .. ظَرْف جُوَّاهْ جَوَابْ" },
        { char: "ع", name: "حَرْف العَيْنْ", word: "عصفور", emoji: "🐦", speech: "عَيْنْ .. عُصْفُورْ صُغَيَّرْ بِيْغَنِّي" },
        { char: "غ", name: "حَرْف الغَيْنْ", word: "غزالة", emoji: "🦌", speech: "غَيْنْ .. غَزَالَة سَرِيعَة" },
        { char: "ف", name: "حَرْف الفَاءْ", word: "فيل", emoji: "🐘", speech: "فَاءْ .. فِيلْ كِبِيرْ أَبُو زَلُّومَة" },
        { char: "ق", name: "حَرْف القَافْ", word: "قطة", emoji: "🐱", speech: "قَافْ .. قُطَّة شَقِيَّة نُونُو" },
        { char: "ك", name: "حَرْف الكَافْ", word: "كلب", emoji: "🐶", speech: "كَافْ .. كَلْب شُجَاعْ وَوَفِي" },
        { char: "ل", name: "حَرْف اللاَّمْ", word: "ليمون", emoji: "🍋", speech: "لاَمْ .. لِيمُونْ أَصْفَرْ" },
        { char: "م", name: "حَرْف المِيمْ", word: "موز", emoji: "🍌", speech: "مِيمْ .. مَوْز لَذِيذْ وَمُفِيدْ" },
        { char: "ن", name: "حَرْف النُّونْ", word: "نحلة", emoji: "🐝", speech: "نُونْ .. نَحْلَة بْتِعْمِلْ لِنَا عَسَلْ" },
        { char: "هـ", name: "حَرْف الهَاءْ", word: "هرم", emoji: "🔺", speech: "هَاءْ .. هَرَمْ عَالِي فِي الجِيزَة" },
        { char: "و", name: "حَرْف الوَاوْ", word: "وردة", emoji: "🌸", speech: "وَاوْ .. وَرْدَة حَمْرَا رِيحِتْهَا حِلْوَة" },
        { char: "ي", name: "حَرْف اليَاءْ", word: "يد", emoji: "👋", speech: "يَاءْ .. إِيدْ جَمِيلَة بْتِسَلِّمْ" }
      ],
      en: [
        { char: "A", name: "Letter A", word: "Apple", emoji: "🍎", lang: "en-US", speech: "Letter A .. Apple" },
        { char: "B", name: "Letter B", word: "Ball", emoji: "⚽", lang: "en-US", speech: "Letter B .. Ball" },
        { char: "C", name: "Letter C", word: "Cat", emoji: "🐱", lang: "en-US", speech: "Letter C .. Cat" },
        { char: "D", name: "Letter D", word: "Dog", emoji: "🐶", lang: "en-US", speech: "Letter D .. Dog" },
        { char: "E", name: "Letter E", word: "Elephant", emoji: "🐘", lang: "en-US", speech: "Letter E .. Elephant" },
        { char: "F", name: "Letter F", word: "Fish", emoji: "🐟", lang: "en-US", speech: "Letter F .. Fish" }
      ],
      numbers: [
        { char: "1", name: "رَقَمْ وَاحِدْ", word: "شمس واحدة", emoji: "☀️", speech: "رَقَمْ وَاحِدْ .. شَمْس وَاحْدَة فِي السَّمَا" },
        { char: "2", name: "رَقَمْ اِتْنِينْ", word: "عينان", emoji: "👀", speech: "رَقَمْ اِتْنِينْ .. عِينَيَّا الاِتْنِينْ" },
        { char: "3", name: "رَقَمْ تَلاَتَة", word: "3 تفاحات", emoji: "🍎", speech: "رَقَمْ تَلاَتَة .. تَلاَتْ تُفَّاحَاتْ" },
        { char: "4", name: "رَقَمْ أَرْبَعَة", word: "4 عجلات", emoji: "🚗", speech: "رَقَمْ أَرْبَعَة .. عَرَبِيَّة بِأَرْبَعْ عِجَلاَتْ" },
        { char: "5", name: "رَقَمْ خَمْسَة", word: "5 أصابع", emoji: "✋", speech: "رَقَمْ خَمْسَة .. خَمْس صَوَابِعْ فِي الإِيدْ" }
      ],
      animals: [
        { char: "🦁", name: "أَسَدْ", word: "أسد", emoji: "🦁", speech: "أَسَدْ .. مَلِكِ الغَابَة رُوورْ" },
        { char: "🐱", name: "قُطَّة", word: "قطة", emoji: "🐱", speech: "مْيَاوْ مْيَاوْ .. قُطَّة شَقِيَّة" },
        { char: "🐶", name: "كَلْب", word: "كلب", emoji: "🐶", speech: "هَوْ هَوْ .. كَلْب شَاطِرْ" },
        { char: "🐮", name: "بَقَرَة", word: "بقرة", emoji: "🐮", speech: "مُوُوُو .. بَقَرَة تِدِّينَا اللَّبَنْ الحِلْو" }
      ]
    };

    let currentCategoryKey = 'ar';
    let currentCategoryData = [];

    function showScreen(screenId) {
      document.getElementById('screen-main').style.display = 'none';
      document.getElementById('screen-category').style.display = 'none';
      document.getElementById(screenId).style.display = screenId === 'screen-main' ? 'block' : 'flex';
    }

    function enterCategory(key) {
      currentCategoryKey = key;
      currentCategoryData = DB[key];
      showScreen('screen-category');

      // تعديل أسماء التبويبات بناء على القسم
      const isNum = key === 'numbers';
      document.getElementById('tab-learn').innerText = isNum ? '🔢 الأرقام' : '📖 الحروف';
      document.getElementById('tab-find').innerText = isNum ? '🧐 فين الرقم؟' : '🧐 فين الحرف؟';
      document.getElementById('tab-match').innerText = isNum ? '🎯 عدّ ووصّل' : '🎯 وصّل الحرف';
      document.getElementById('tab-color').innerText = isNum ? '🎨 لوّن الرقم' : '🎨 لوّن الحرف';

      const titles = { ar: 'الحروف العربية', en: 'الحروف الإنجليزية', numbers: 'الأرقام والعد', animals: 'الحيوانات' };
      document.getElementById('category-title').innerText = titles[key] || '';

      switchCategoryTab('learn');
    }

    function switchCategoryTab(tab) {
      document.querySelectorAll('.activity-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');

      document.getElementById('cat-view-learn').style.display = 'none';
      document.getElementById('cat-view-find').style.display = 'none';
      document.getElementById('cat-view-match').style.display = 'none';
      document.getElementById('cat-view-color').style.display = 'none';

      if (tab === 'learn') {
        document.getElementById('cat-view-learn').style.display = 'grid';
        renderLearningGrid();
      } else if (tab === 'find') {
        document.getElementById('cat-view-find').style.display = 'block';
        startFindGame();
      } else if (tab === 'match') {
        document.getElementById('cat-view-match').style.display = 'block';
        startMatchGame();
      } else if (tab === 'color') {
        document.getElementById('cat-view-color').style.display = 'flex';
        initColoringCanvas();
      }
    }

    function renderLearningGrid() {
      const grid = document.getElementById('cat-view-learn');
      grid.innerHTML = '';
      currentCategoryData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.onclick = () => speak(item.speech || item.sound, item.lang || 'ar-EG');
        div.innerHTML = `
          <div class="item-char">${item.char}</div>
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-word">${item.word}</div>
        `;
        grid.appendChild(div);
      });
    }

    /* 1. لعبة فين الحرف بنطق كامل وصريح */
    let currentFindTarget = null;
    function startFindGame() {
      const list = currentCategoryData;
      const target = list[Math.floor(Math.random() * list.length)];
      currentFindTarget = target;

      const wrong = list.filter(l => l.char !== target.char).sort(() => 0.5 - Math.random()).slice(0, 2);
      const options = [target, ...wrong].sort(() => 0.5 - Math.random());

      document.getElementById('find-game-title').innerText = `فِينْ (${target.name})؟ 🧐`;
      
      const lang = target.lang || 'ar-EG';
      const questionText = lang === 'en-US' ? `Where is ${target.name}?` : `فِينْ ${target.name}؟`;
      speak(questionText, lang);

      const container = document.getElementById('find-options-container');
      container.innerHTML = options.map(opt => `
        <button class="game-choice-btn" onclick="checkFindChoice('${opt.char}')">${opt.char}</button>
      `).join('');
    }

    function repeatFindAudio() {
      if (currentFindTarget) {
        const lang = currentFindTarget.lang || 'ar-EG';
        const questionText = lang === 'en-US' ? `Where is ${currentFindTarget.name}?` : `فِينْ ${currentFindTarget.name}؟`;
        speak(questionText, lang);
      }
    }

    function checkFindChoice(chosen) {
      if (chosen === currentFindTarget.char) {
        speak("شَاطِرْ جِدّاً يَا بَطَلْ! إِجَابَة مُمْتَازَة! 🎉", currentFindTarget.lang || 'ar-EG');
        setTimeout(startFindGame, 1700);
      } else {
        speak("حَاوِلْ تَانِي يَا حَبِيبِي!", currentFindTarget.lang || 'ar-EG');
      }
    }

    /* 2. لعبة وصّل الحرف بالصورة */
    let currentMatchTarget = null;
    function startMatchGame() {
      const list = currentCategoryData;
      const target = list[Math.floor(Math.random() * list.length)];
      currentMatchTarget = target;

      document.getElementById('match-target-char').innerText = target.char;
      speak(`مَا هِيَ الصُّورَة الَّتِي تَبْدَأُ بِـ ${target.name}؟`, target.lang || 'ar-EG');

      const wrong = list.filter(l => l.char !== target.char).sort(() => 0.5 - Math.random()).slice(0, 2);
      const options = [target, ...wrong].sort(() => 0.5 - Math.random());

      const container = document.getElementById('match-options-container');
      container.innerHTML = options.map(opt => `
        <button class="game-choice-btn" style="font-size: 46px;" onclick="checkMatchChoice('${opt.char}')">
          ${opt.emoji}
          <div style="font-size: 15px; font-weight: 900; color: #4B5563;">${opt.word}</div>
        </button>
      `).join('');
    }

    function checkMatchChoice(chosen) {
      if (chosen === currentMatchTarget.char) {
        speak("أَحْسَنْتْ يَا شَاطِرْ! تَوَاصُلْ صَحِيحْ 👏", currentMatchTarget.lang || 'ar-EG');
        setTimeout(startMatchGame, 1700);
      } else {
        speak("فَكَّرْ تَانِي، مَا هِيَ الصُّورَة الصَّحِيحَة؟", currentMatchTarget.lang || 'ar-EG');
      }
    }

    /* 3. نشاط التلوين المدمج */
    let canvas, ctx, painting = false;
    let currentColor = '#EF4444';
    let colorCharIdx = 0;

    function initColoringCanvas() {
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      setupCanvas();
      drawColorChar();
    }

    function drawColorChar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const item = currentCategoryData[colorCharIdx % currentCategoryData.length];
      ctx.font = 'bold 200px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#D1D5DB';
      ctx.strokeText(item.char, canvas.width / 2, canvas.height / 2 + 10);
      speak(`يَلَّا نْلَوِّنْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function nextColoringChar() {
      colorCharIdx++;
      drawColorChar();
    }

    function clearCanvas() {
      drawColorChar();
    }

    function setColor(c, el) {
      currentColor = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setupCanvas() {
      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };
      const start = e => {
        painting = true;
        ctx.beginPath();
        const p = getPos(e);
        ctx.moveTo(p.x, p.y);
      };
      const move = e => {
        if (!painting) return;
        const p = getPos(e);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };
      const stop = () => { painting = false; };

      canvas.onmousedown = start;
      canvas.onmousemove = move;
      window.onmouseup = stop;
      canvas.ontouchstart = start;
      canvas.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* الصوت المصري البشري */
    let cachedVoices = [];
    function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, lang = 'ar-EG') {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.86;
      u.pitch = 1.2;

      if (lang.startsWith('ar') && cachedVoices.length > 0) {
        const eg = cachedVoices.find(v => v.lang.includes('EG') || v.name.includes('Maged') || v.name.includes('Maryam'));
        if (eg) u.voice = eg;
      }
      window.speechSynthesis.speak(u);
    }

    async function forceAppUpdate() {
      if (!navigator.onLine) return alert('يرجى الاتصال بالإنترنت أولاً لتحديث اللعبة.');
      if (confirm('تحديث اللعبة وتنزيل كل الميزات الجديدة؟')) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
    }
  </script>
</body>
</html>
