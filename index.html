<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالم الصغار المرح 🎈</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#F59E0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(180deg, #FDE68A 0%, #FEF3C7 100%);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
    }
    .app-title {
      font-size: 24px;
      font-weight: 900;
      color: #D97706;
      text-shadow: 2px 2px #fff;
    }
    .update-btn {
      background: #FFFFFF;
      border: 2px solid #D97706;
      color: #B45309;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #D97706;
    }
    .update-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D97706;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    .category-card {
      background: #FFFFFF;
      border: 4px solid #F59E0B;
      border-radius: 26px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 0px #D97706;
      transition: transform 0.1s;
    }
    .category-card:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0px #D97706;
    }
    .card-icon { font-size: 46px; margin-bottom: 6px; }
    .card-icon-text { font-size: 38px; font-weight: 900; color: #D97706; line-height: 1.1; margin-bottom: 6px; }
    .card-name { font-size: 18px; font-weight: 900; color: #78350F; text-align: center; }

    .screen-panel {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
    }

    .back-btn {
      align-self: flex-start;
      background: #EF4444;
      border: 3px solid #B91C1C;
      color: white;
      font-size: 18px;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 5px 0 #991B1B;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .back-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #991B1B;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      padding: 4px;
    }
    .item-card {
      background: white;
      border: 3px solid #3B82F6;
      border-radius: 20px;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #1D4ED8;
      cursor: pointer;
    }
    .item-card:active {
      transform: scale(0.92);
    }
    .item-char { font-size: 38px; font-weight: 900; color: #1E3A8A; }
    .item-emoji { font-size: 38px; margin: 2px 0; }
    .item-word { font-size: 16px; font-weight: 900; color: #4B5563; }

    /* لوحة التلوين */
    .color-palette {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .color-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .color-dot.active {
      transform: scale(1.15);
      border-color: #111;
    }
    #paint-canvas {
      background: white;
      border: 4px solid #F59E0B;
      border-radius: 24px;
      box-shadow: 0 8px 0 #D97706;
      touch-action: none;
    }

    /* شاشة الألعاب */
    .game-card-box {
      background: white;
      border: 4px solid #10B981;
      border-radius: 26px;
      padding: 24px 16px;
      box-shadow: 0 8px 0 #059669;
      width: 100%;
      text-align: center;
    }
    .game-question {
      font-size: 24px;
      font-weight: 900;
      color: #065F46;
      margin-bottom: 20px;
    }
    .game-options {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }
    .game-btn {
      flex: 1;
      background: #EFF6FF;
      border: 3px solid #3B82F6;
      border-radius: 20px;
      padding: 16px 8px;
      font-size: 38px;
      font-weight: 900;
      color: #1D4ED8;
      box-shadow: 0 6px 0 #2563EB;
      cursor: pointer;
    }
    .game-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2563EB;
    }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div id="screen-main" style="width: 100%; max-width: 500px;">
    <div class="top-bar">
      <div class="app-title">🎈 عالم الأذكياء الصغار</div>
      <button class="update-btn" onclick="forceAppUpdate()">🔄 تحديث اللعبة</button>
    </div>
    
    <div class="menu-grid">
      <!-- بطاقة الحروف العربية بأيقونة عربية مبهجة -->
      <div class="category-card" onclick="openLetters('ar')">
        <span class="card-icon-text">أ ب ت</span>
        <span class="card-name">الحروف العربية</span>
      </div>
      <div class="category-card" onclick="openLetters('en')">
        <span class="card-icon">🔠</span>
        <span class="card-name">الحروف الإنجليزية</span>
      </div>
      <div class="category-card" onclick="openSection('numbers')">
        <span class="card-icon">🔢</span>
        <span class="card-name">الأرقام والعد</span>
      </div>
      <div class="category-card" onclick="openSection('animals')">
        <span class="card-icon">🦁</span>
        <span class="card-name">أصوات الحيوانات</span>
      </div>
      <div class="category-card" onclick="openColoring()">
        <span class="card-icon">🎨</span>
        <span class="card-name">أنشطة التلوين</span>
      </div>
      <div class="category-card" onclick="startLetterGame()">
        <span class="card-icon">🎮</span>
        <span class="card-name">ألعاب المرح</span>
      </div>
    </div>
  </div>

  <!-- لوحة الحروف والبطاقات -->
  <div id="screen-cards" class="screen-panel">
    <button class="back-btn" onclick="showScreen('screen-main')">🔙 رجوع</button>
    <div class="board-grid" id="cards-grid"></div>
  </div>

  <!-- لوحة التلوين -->
  <div id="screen-coloring" class="screen-panel">
    <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px;">
      <button class="back-btn" style="margin: 0;" onclick="showScreen('screen-main')">🔙 رجوع</button>
      <div style="display: flex; gap: 8px;">
        <button class="back-btn" style="background: #3B82F6; border-color: #1D4ED8; box-shadow: 0 4px 0 #1E40AF; margin: 0;" onclick="nextColoringChar()">حرف آخر ↻</button>
        <button class="back-btn" style="background: #F59E0B; border-color: #D97706; box-shadow: 0 4px 0 #B45309; margin: 0;" onclick="clearCanvas()">مسح 🗑️</button>
      </div>
    </div>

    <div class="color-palette">
      <div class="color-dot active" style="background: #EF4444;" onclick="setColor('#EF4444', this)"></div>
      <div class="color-dot" style="background: #3B82F6;" onclick="setColor('#3B82F6', this)"></div>
      <div class="color-dot" style="background: #10B981;" onclick="setColor('#10B981', this)"></div>
      <div class="color-dot" style="background: #F59E0B;" onclick="setColor('#F59E0B', this)"></div>
      <div class="color-dot" style="background: #8B5CF6;" onclick="setColor('#8B5CF6', this)"></div>
      <div class="color-dot" style="background: #EC4899;" onclick="setColor('#EC4899', this)"></div>
    </div>

    <canvas id="paint-canvas" width="340" height="340"></canvas>
  </div>

  <!-- شاشة الألعاب -->
  <div id="screen-game" class="screen-panel">
    <button class="back-btn" onclick="showScreen('screen-main')">🔙 رجوع</button>
    <div class="game-card-box">
      <div class="game-question" id="game-title">أين الحرف؟</div>
      <button class="back-btn" style="background: #3B82F6; border-color: #1D4ED8; box-shadow: 0 4px 0 #1E40AF; margin-bottom: 20px;" onclick="repeatQuestionAudio()">🔊 اسمع مرة ثانية</button>
      <div class="game-options" id="game-options-container"></div>
    </div>
  </div>

  <script>
    // الحروف الهجائية الـ 28 كاملة مع نطق مرح باللهجة المصرية
    const DB = {
      ar: [
        { char: "أ", word: "أرنب", emoji: "🐰", sound: "أَ .. أَرْنَبْ بِيْطَفْطَفْ" },
        { char: "ب", word: "بطة", emoji: "🦆", sound: "بَ .. بَطَّة بْتِعُومْ" },
        { char: "ت", word: "تفاح", emoji: "🍎", sound: "تَ .. تُفَّاحْ لَذِيذْ" },
        { char: "ث", word: "ثعلب", emoji: "🦊", sound: "ثَ .. ثَعْلَبْ مَكَّارْ" },
        { char: "ج", word: "جمل", emoji: "🐪", sound: "جِيمْ .. جَمَلْ فِي الصَّحْرَا" },
        { char: "ح", word: "حصان", emoji: "🐴", sound: "حَ .. حُصَانْ سَرِيعْ" },
        { char: "خ", word: "خروف", emoji: "🐑", sound: "خَ .. خَرُوفْ حُلْو" },
        { char: "د", word: "دب", emoji: "🐻", sound: "دَالْ .. دُبْ كِبِيرْ" },
        { char: "ذ", word: "ذرة", emoji: "🌽", sound: "ذَالْ .. ذُرَة صَفْرَا صَفْرَا" },
        { char: "ر", word: "ريشة", emoji: "🪶", sound: "رَا .. رِيشَة خَفِيفَة" },
        { char: "ز", word: "زرافة", emoji: "🦒", sound: "زَايْ .. زَرَافَة رَقَبِتْهَا طَوِيلَة" },
        { char: "س", word: "سمكة", emoji: "🐟", sound: "سِينْ .. سَمَكَة فِي المَيَّا" },
        { char: "ش", word: "شمس", emoji: "☀️", sound: "شِينْ .. شَمْس دَافْيَة" },
        { char: "ص", word: "صقر", emoji: "🦅", sound: "صَادْ .. صَقْر بِيْطِيرْ" },
        { char: "ض", word: "ضفدع", emoji: "🐸", sound: "ضَادْ .. ضِفْدَعْ بِيْنُطْ" },
        { char: "ط", word: "طيارة", emoji: "✈️", sound: "طَا .. طَيَّارَة فُوقْ" },
        { char: "ظ", word: "ظرف", emoji: "✉️", sound: "ظَا .. ظَرْف جُوَّاهْ جَوَابْ" },
        { char: "ع", word: "عصفور", emoji: "🐦", sound: "عَيْنْ .. عُصْفُورْ صُغَيَّرْ" },
        { char: "غ", word: "غزالة", emoji: "🦌", sound: "غَيْنْ .. غَزَالَة سَرِيعَة" },
        { char: "ف", word: "فيل", emoji: "🐘", sound: "فَا .. فِيلْ أَبُو زَلُّومَة" },
        { char: "ق", word: "قطة", emoji: "🐱", sound: "قَافْ .. قُطَّة نُونُو" },
        { char: "ك", word: "كلب", emoji: "🐶", sound: "كَافْ .. كَلْب شُجَاعْ" },
        { char: "ل", word: "ليمون", emoji: "🍋", sound: "لاَمْ .. لِيمُونْ أَصْفَرْ" },
        { char: "م", word: "موز", emoji: "🍌", sound: "مِيمْ .. مَوْز لَذِيذْ" },
        { char: "ن", word: "نحلة", emoji: "🐝", sound: "نُونْ .. نَحْلَة بْتِعْمِلْ عَسَلْ" },
        { char: "هـ", word: "هرم", emoji: "🔺", sound: "هَا .. هَرَمْ عَالِي" },
        { char: "و", word: "وردة", emoji: "🌸", sound: "وَاوْ .. وَرْدَة حَمْرَا جَمِيلَة" },
        { char: "ي", word: "يد", emoji: "👋", sound: "يَا .. إِيدْ بْتِسَلِّمْ" }
      ],
      en: [
        { char: "A", word: "Apple", emoji: "🍎", lang: "en-US", sound: "A .. Apple" },
        { char: "B", word: "Ball", emoji: "⚽", lang: "en-US", sound: "B .. Ball" },
        { char: "C", word: "Cat", emoji: "🐱", lang: "en-US", sound: "C .. Cat" },
        { char: "D", word: "Dog", emoji: "🐶", lang: "en-US", sound: "D .. Dog" },
        { char: "E", word: "Elephant", emoji: "🐘", lang: "en-US", sound: "E .. Elephant" },
        { char: "F", word: "Fish", emoji: "🐟", lang: "en-US", sound: "F .. Fish" }
      ],
      numbers: [
        { char: "1", word: "واحد", emoji: "☝️", sound: "وَاحِدْ .. رَبِّنَا وَاحِدْ" },
        { char: "2", word: "اثنان", emoji: "✌️", sound: "اِتْنِينْ .. عِينَيَّا الاِتْنِينْ" },
        { char: "3", word: "ثلاثة", emoji: "🥉", sound: "تَلاَتَة .. تَلاَتْ صُحَابْ" },
        { char: "4", word: "أربعة", emoji: "🍀", sound: "أَرْبَعَة .. أَرْبَعْ عَرَبِيَّاتْ" },
        { char: "5", word: "خمسة", emoji: "✋", sound: "خَمْسَة .. صَوَابِعْ إِيدِيَا الحِلْوَة" }
      ],
      animals: [
        { char: "🦁", word: "أسد", emoji: "🦁", sound: "أَسَدْ .. مَلِكِ الغَابَة رُوورْ" },
        { char: "🐱", word: "قطة", emoji: "🐱", sound: "مْيَاوْ مْيَاوْ .. قُطَّة حِلْوَة" },
        { char: "🐶", word: "كلب", emoji: "🐶", sound: "هَوْ هَوْ .. كَلْب شَاطِرْ" },
        { char: "🐮", word: "بقرة", emoji: "🐮", sound: "مُوُوُو .. بَقَرَة تِدِّينَا اللَّبَنْ" },
        { char: "🐥", word: "كتكوت", emoji: "🐥", sound: "صُوصُو صُوصُو .. كَتْكُوتْ صُغَيَّرْ" }
      ]
    };

    function showScreen(screenId) {
      document.getElementById('screen-main').style.display = 'none';
      document.getElementById('screen-cards').style.display = 'none';
      document.getElementById('screen-coloring').style.display = 'none';
      document.getElementById('screen-game').style.display = 'none';

      document.getElementById(screenId).style.display = 'flex';
      if(screenId === 'screen-main') document.getElementById('screen-main').style.display = 'block';
    }

    // نطق بشري مخصص ومرن
    let cachedVoices = [];
    function loadVoices() {
      cachedVoices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, lang = 'ar-EG') {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.88;  // نبرة هادئة ومناسبة لسمع الطفل
      u.pitch = 1.25; // جعل الصوت أقرب لصوت طفل أو معلم مرح

      // البحث عن صوت مصري مدمج على الجهاز
      if (lang.startsWith('ar') && cachedVoices.length > 0) {
        const egVoice = cachedVoices.find(v => v.lang.includes('EG') || v.name.includes('Maged') || v.name.includes('Maryam') || v.name.includes('Tarik'));
        if (egVoice) u.voice = egVoice;
      }
      window.speechSynthesis.speak(u);
    }

    // زر تحديث التطبيق ومسح الكاش
    async function forceAppUpdate() {
      if (!navigator.onLine) return alert('يرجى الاتصال بالإنترنت أولاً لتحديث اللعبة.');
      if (confirm('هل تريد تنزيل أحدث التحديثات الآن؟')) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
    }

    function openLetters(langKey) {
      showScreen('screen-cards');
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';
      DB[langKey].forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.onclick = () => speak(item.sound, item.lang || 'ar-EG');
        div.innerHTML = `
          <div class="item-char">${item.char}</div>
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-word">${item.word}</div>
        `;
        grid.appendChild(div);
      });
    }

    function openSection(secKey) {
      showScreen('screen-cards');
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';
      DB[secKey].forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.onclick = () => speak(item.sound, item.lang || 'ar-EG');
        div.innerHTML = `
          <div class="item-char">${item.char}</div>
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-word">${item.word}</div>
        `;
        grid.appendChild(div);
      });
    }

    /* التلوين */
    let canvas, ctx, painting = false;
    let currentColor = '#EF4444';
    const coloringChars = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'A', 'B', 'C', '1', '2', '3'];
    let colorCharIndex = 0;

    function openColoring() {
      showScreen('screen-coloring');
      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');
      setupCanvasEvents();
      drawLetterTemplate();
      speak("يَلَّا نْلَوِّنْ الحَرْفِ الجَمِيلْ!", "ar-EG");
    }

    function drawLetterTemplate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const ch = coloringChars[colorCharIndex];
      ctx.font = 'bold 210px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#D1D5DB';
      ctx.strokeText(ch, canvas.width / 2, canvas.height / 2 + 10);
    }

    function nextColoringChar() {
      colorCharIndex = (colorCharIndex + 1) % coloringChars.length;
      drawLetterTemplate();
      speak("حَرْف جَدِيدْ! اخْتَارْ لُونْ ولَوِّنْ بِصُبَاعَكْ", "ar-EG");
    }

    function clearCanvas() {
      drawLetterTemplate();
    }

    function setColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setupCanvasEvents() {
      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = e => {
        painting = true;
        ctx.beginPath();
        const p = getPos(e);
        ctx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!painting) return;
        const p = getPos(e);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };

      const stop = () => { painting = false; };

      canvas.onmousedown = start;
      canvas.onmousemove = move;
      window.onmouseup = stop;

      canvas.ontouchstart = start;
      canvas.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* ألعاب المرح */
    let currentCorrectLetter = null;

    function startLetterGame() {
      showScreen('screen-game');
      const list = DB.ar;
      const target = list[Math.floor(Math.random() * list.length)];
      currentCorrectLetter = target;

      const wrongOptions = list.filter(l => l.char !== target.char).sort(() => 0.5 - Math.random()).slice(0, 2);
      const options = [target, ...wrongOptions].sort(() => 0.5 - Math.random());

      document.getElementById('game-title').innerText = `فِينْ حَرْف (${target.char})؟ 🧐`;
      speak(`فِينْ حَرْف ${target.char}؟`, 'ar-EG');

      const container = document.getElementById('game-options-container');
      container.innerHTML = options.map(opt => `
        <button class="game-btn" onclick="checkGameChoice('${opt.char}')">${opt.char}</button>
      `).join('');
    }

    function repeatQuestionAudio() {
      if (currentCorrectLetter) {
        speak(`فِينْ حَرْف ${currentCorrectLetter.char}؟`, 'ar-EG');
      }
    }

    function checkGameChoice(chosen) {
      if (chosen === currentCorrectLetter.char) {
        speak("شَاطِرْ يَا بَطَلْ! إِجَابَة صَحْ مَيَّة فِي المَيَّة! 🎉", "ar-EG");
        setTimeout(startLetterGame, 1600);
      } else {
        speak("حَاوِلْ تَانِي يَا حَبِيبِي!", "ar-EG");
      }
    }
  </script>
</body>
</html>
