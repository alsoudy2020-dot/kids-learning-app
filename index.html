<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عالم الصغار التعليمي 🎈</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#F59E0B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background: linear-gradient(180deg, #FDE68A 0%, #FEF3C7 100%);
      min-height: 100vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 900;
      color: #D97706;
      text-shadow: 2px 2px #fff;
    }
    .update-btn {
      background: #FFFFFF;
      border: 2px solid #D97706;
      color: #B45309;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 #D97706;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 500px;
    }

    .category-card {
      background: #FFFFFF;
      border: 4px solid #F59E0B;
      border-radius: 24px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 0px #D97706;
    }
    .category-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #D97706; }
    .card-icon-text { font-size: 34px; font-weight: 900; color: #D97706; margin-bottom: 4px; }
    .card-name { font-size: 18px; font-weight: 900; color: #78350F; text-align: center; }

    .section-activities-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .activity-tab-btn {
      flex: 1;
      min-width: 76px;
      background: #FFFFFF;
      border: 3px solid #3B82F6;
      border-radius: 16px;
      padding: 8px 2px;
      font-size: 13px;
      font-weight: 900;
      color: #1D4ED8;
      box-shadow: 0 4px 0 #2563EB;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .activity-tab-btn.active {
      background: #3B82F6;
      color: white;
    }

    .screen-panel {
      display: none;
      width: 100%;
      max-width: 500px;
      flex-direction: column;
      align-items: center;
    }

    .back-btn {
      align-self: flex-start;
      background: #EF4444;
      border: 3px solid #B91C1C;
      color: white;
      font-size: 16px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 18px;
      box-shadow: 0 4px 0 #991B1B;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      padding: 4px;
    }
    .item-card {
      background: white;
      border: 3px solid #3B82F6;
      border-radius: 18px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 5px 0 #1D4ED8;
      cursor: pointer;
    }
    .item-card:active { transform: scale(0.92); }
    .item-char { font-size: 34px; font-weight: 900; color: #1E3A8A; }
    .item-emoji { font-size: 34px; margin: 2px 0; }
    .item-word { font-size: 15px; font-weight: 900; color: #4B5563; }

    /* ألعاب الألواح */
    .game-box {
      width: 100%;
      background: white;
      border: 4px solid #10B981;
      border-radius: 22px;
      padding: 16px 10px;
      box-shadow: 0 6px 0 #059669;
      text-align: center;
      margin-top: 4px;
      position: relative;
    }
    .game-title {
      font-size: 20px;
      font-weight: 900;
      color: #065F46;
      margin-bottom: 12px;
    }

    /* التوصيل التفاعلي الصريح */
    .matching-board {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }
    .match-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 48%;
    }
    .match-btn {
      background: #F3F4F6;
      border: 4px solid #3B82F6;
      border-radius: 20px;
      padding: 12px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 32px;
      font-weight: 900;
      color: #1E3A8A;
      box-shadow: 0 4px 0 #1D4ED8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .match-btn.selected {
      background: #FEF08A;
      border-color: #EAB308;
      transform: scale(1.04);
    }
    .match-btn.matched {
      background: #DCFCE7 !important;
      border-color: #16A34A !important;
      color: #15803D !important;
      box-shadow: 0 4px 0 #15803D !important;
    }

    /* التلوين بملء الشاشة */
    .fullscreen-paint-box {
      width: 100vw;
      height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      margin-top: -10px;
    }
    .fullscreen-canvas {
      width: 95vw;
      max-width: 460px;
      height: 66vh;
      background: #FFFFFF;
      border: 5px solid #F59E0B;
      border-radius: 26px;
      box-shadow: 0 8px 0 #D97706;
      touch-action: none;
    }
    .color-palette {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      justify-content: center;
    }
    .color-dot {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    .color-dot.active { transform: scale(1.2); border-color: #111; }

    /* لعبة قفز الضفدع نحو الحرف */
    .jumping-stage {
      width: 100%;
      height: 320px;
      background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 70%, #86EFAC 100%);
      border: 4px solid #0284C7;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    .frog-player {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 52px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .jump-target {
      position: absolute;
      top: 25px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: white;
      border: 4px solid #3B82F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: #1D4ED8;
      box-shadow: 0 5px 0 #2563EB;
      cursor: pointer;
    }

    /* لعبة فرقعة الفقاعات */
    .bubble-container {
      width: 100%;
      height: 320px;
      background: radial-gradient(circle, #E0E7FF 0%, #C7D2FE 100%);
      border: 4px solid #6366F1;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }
    .bubble-item {
      position: absolute;
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid #818CF8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #4338CA;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
      cursor: pointer;
      animation: floatBubble 4s infinite ease-in-out alternate;
    }
    @keyframes floatBubble {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(5deg); }
    }
  </style>
</head>
<body>

  <!-- القائمة الرئيسية -->
  <div id="screen-main" style="width: 100%; max-width: 500px;">
    <div class="top-bar">
      <div class="app-title">🎈 عالم الأذكياء الصغار</div>
      <button class="update-btn" onclick="forceAppUpdate()">🔄 تحديث اللعبة</button>
    </div>
    
    <div class="menu-grid">
      <div class="category-card" onclick="enterCategory('ar')">
        <span class="card-icon-text">أ ب ت</span>
        <span class="card-name">الحروف العربية وألعابها</span>
      </div>
      <div class="category-card" onclick="enterCategory('en')">
        <span class="card-icon-text">A B C</span>
        <span class="card-name">الحروف الإنجليزية وألعابها</span>
      </div>
      <div class="category-card" onclick="enterCategory('numbers')">
        <span class="card-icon-text">١ ٢ ٣</span>
        <span class="card-name">الأرقام وألعاب العد</span>
      </div>
      <div class="category-card" onclick="enterCategory('animals')">
        <span class="card-icon-text">🦁 🐮</span>
        <span class="card-name">أصوات الحيوانات</span>
      </div>
    </div>
  </div>

  <!-- شاشة الأقسام المدمجة -->
  <div id="screen-category" class="screen-panel">
    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px;">
      <button class="back-btn" style="margin:0;" onclick="showScreen('screen-main')">🔙 القائمة</button>
      <div id="category-title" style="font-size: 18px; font-weight: 900; color: #78350F;"></div>
    </div>

    <!-- شريط الأنشطة المدمجة داخل القسم -->
    <div class="section-activities-bar">
      <div class="activity-tab-btn active" id="tab-learn" onclick="switchCategoryTab('learn')">📖 الحروف</div>
      <div class="activity-tab-btn" id="tab-match" onclick="switchCategoryTab('match')">🎯 وصّل</div>
      <div class="activity-tab-btn" id="tab-color" onclick="switchCategoryTab('color')">🎨 لوّن الحرف</div>
      <div class="activity-tab-btn" id="tab-jump" onclick="switchCategoryTab('jump')">🐸 قفز الحروف</div>
      <div class="activity-tab-btn" id="tab-bubbles" onclick="switchCategoryTab('bubbles')">🫧 فرقعة</div>
    </div>

    <!-- 1. شاشة البطاقات العادية -->
    <div id="cat-view-learn" class="board-grid"></div>

    <!-- 2. شاشة التوصيل المباشر الصريح الموثوق للأطفال -->
    <div id="cat-view-match" class="game-box" style="display: none;">
      <div class="game-title">اضغط على الحرف ثم اضغط على صورته الصحيحة! 👇</div>
      <div class="matching-board">
        <div class="match-col" id="match-col-right"></div>
        <div class="match-col" id="match-col-left"></div>
      </div>
    </div>

    <!-- 3. شاشة التلوين بملء الشاشة مع قناع ذكي -->
    <div id="cat-view-color" class="fullscreen-paint-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; width: 95vw; max-width: 460px; margin-bottom: 6px;">
        <button class="back-btn" style="margin: 0; padding: 4px 12px; font-size: 13px; background: #3B82F6; border-color: #1D4ED8;" onclick="nextColoringChar()">حرف تاني ↻</button>
        <button class="back-btn" style="margin: 0; padding: 4px 12px; font-size: 13px; background: #F59E0B; border-color: #D97706;" onclick="clearCanvas()">مسح 🗑️</button>
      </div>

      <canvas id="paint-canvas" class="fullscreen-canvas"></canvas>

      <div class="color-palette">
        <div class="color-dot active" style="background: #EF4444;" onclick="setColor('#EF4444', this)"></div>
        <div class="color-dot" style="background: #3B82F6;" onclick="setColor('#3B82F6', this)"></div>
        <div class="color-dot" style="background: #10B981;" onclick="setColor('#10B981', this)"></div>
        <div class="color-dot" style="background: #F59E0B;" onclick="setColor('#F59E0B', this)"></div>
        <div class="color-dot" style="background: #8B5CF6;" onclick="setColor('#8B5CF6', this)"></div>
        <div class="color-dot" style="background: #EC4899;" onclick="setColor('#EC4899', this)"></div>
      </div>
    </div>

    <!-- 4. لعبة قفز الضفدع للوصول إلى الحرف -->
    <div id="cat-view-jump" class="game-box" style="display: none;">
      <div class="game-title" id="jump-task-title">ساعد الضفدع يقفز على الحرف الصحيح! 🐸</div>
      <div class="jumping-stage" id="jump-stage">
        <div class="frog-player" id="frog-hero">🐸</div>
      </div>
    </div>

    <!-- 5. لعبة فرقعة الفقاعات والبحث عن الحرف -->
    <div id="cat-view-bubbles" class="game-box" style="display: none;">
      <div class="game-title" id="bubbles-task-title">فرقع فقاعة الحرف المطلوب! 🫧</div>
      <div class="bubble-container" id="bubble-stage"></div>
    </div>
  </div>

  <script>

        { char: "2", name: "رَقَمْ اِتْنِينْ", word: "عينان", emoji: "👀", speech: "رَقَمْ اِتْنِينْ .. عِينَيَّا الاِتْنِينْ" },
        { char: "3", name: "رَقَمْ تَلاَتَة", word: "3 تفاحات", emoji: "🍎", speech: "رَقَمْ تَلاَتَة .. تَلاَتْ تُفَّاحَاتْ" },
        { char: "4", name: "رَقَمْ أَرْبَعَة", word: "4 عجلات", emoji: "🚗", speech: "رَقَمْ أَرْبَعَة .. عَرَبِيَّة بِأَرْبَعْ عِجَلاَتْ" },
        { char: "5", name: "رَقَمْ خَمْسَة", word: "5 أصابع", emoji: "✋", speech: "رَقَمْ خَمْسَة .. خَمْس صَوَابِعْ فِي الإِيدْ" }
      ],
      animals: [
        { char: "🦁", name: "أَسَدْ", word: "أسد", emoji: "🦁", speech: "أَسَدْ .. مَلِكِ الغَابَة رُوورْ" },
        { char: "🐱", name: "قُطَّة", word: "قطة", emoji: "🐱", speech: "مْيَاوْ مْيَاوْ .. قُطَّة شَقِيَّة" },
        { char: "🐶", name: "كَلْب", word: "كلب", emoji: "🐶", speech: "هَوْ هَوْ .. كَلْب شَاطِرْ" },
        { char: "🐮", name: "بَقَرَة", word: "بقرة", emoji: "🐮", speech: "مُوُوُو .. بَقَرَة تِدِّينَا اللَّبَنْ الحِلْو" }
      ]
    };

    let currentCategoryKey = 'ar';
    let currentCategoryData = [];

    function showScreen(screenId) {
      document.getElementById('screen-main').style.display = 'none';
      document.getElementById('screen-category').style.display = 'none';
      document.getElementById(screenId).style.display = screenId === 'screen-main' ? 'block' : 'flex';
    }

    function enterCategory(key) {
      currentCategoryKey = key;
      currentCategoryData = DB[key];
      showScreen('screen-category');

      const isNum = key === 'numbers';
      document.getElementById('tab-learn').innerText = isNum ? '🔢 الأرقام' : '📖 الحروف';
      document.getElementById('tab-match').innerText = isNum ? '🎯 وصّل العدد' : '🎯 وصّل الحرف';
      document.getElementById('tab-color').innerText = isNum ? '🎨 لوّن الرقم' : '🎨 لوّن الحرف';
      document.getElementById('tab-jump').innerText = isNum ? '🐸 قفز الأرقام' : '🐸 قفز الحروف';
      document.getElementById('tab-bubbles').innerText = '🫧 فرقعة';

      const titles = { ar: 'الحروف العربية', en: 'الحروف الإنجليزية', numbers: 'الأرقام والعد', animals: 'الحيوانات' };
      document.getElementById('category-title').innerText = titles[key] || '';

      switchCategoryTab('learn');
    }

    function switchCategoryTab(tab) {
      document.querySelectorAll('.activity-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');

      document.getElementById('cat-view-learn').style.display = 'none';
      document.getElementById('cat-view-match').style.display = 'none';
      document.getElementById('cat-view-color').style.display = 'none';
      document.getElementById('cat-view-jump').style.display = 'none';
      document.getElementById('cat-view-bubbles').style.display = 'none';

      if (tab === 'learn') {
        document.getElementById('cat-view-learn').style.display = 'grid';
        renderLearningGrid();
      } else if (tab === 'match') {
        document.getElementById('cat-view-match').style.display = 'block';
        startMatchingGame();
      } else if (tab === 'color') {
        document.getElementById('cat-view-color').style.display = 'flex';
        initColoringCanvas();
      } else if (tab === 'jump') {
        document.getElementById('cat-view-jump').style.display = 'block';
        startJumpingGame();
      } else if (tab === 'bubbles') {
        document.getElementById('cat-view-bubbles').style.display = 'block';
        startBubblesGame();
      }
    }

    function renderLearningGrid() {
      const grid = document.getElementById('cat-view-learn');
      grid.innerHTML = '';
      currentCategoryData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.onclick = () => speak(item.speech || item.name, item.lang || 'ar-EG');
        div.innerHTML = `
          <div class="item-char">${item.char}</div>
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-word">${item.word}</div>
        `;
        grid.appendChild(div);
      });
    }

    /* 1. نظام التوصيل المباشر الصريح */
    let selectedLetterBtn = null;
    let matchPairsList = [];

    function startMatchingGame() {
      selectedLetterBtn = null;
      const rightCol = document.getElementById('match-col-right');
      const leftCol = document.getElementById('match-col-left');
      rightCol.innerHTML = '';
      leftCol.innerHTML = '';

      matchPairsList = [...currentCategoryData].sort(() => 0.5 - Math.random()).slice(0, 3);

      matchPairsList.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn';
        btn.dataset.char = item.char;
        btn.innerText = item.char;
        btn.onclick = () => onSelectMatchLetter(btn);
        rightCol.appendChild(btn);
      });

      const shuffled = [...matchPairsList].sort(() => 0.5 - Math.random());
      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'match-btn';
        btn.dataset.char = item.char;
        btn.innerHTML = `${item.emoji} <span style="font-size:15px; margin-right:4px;">${item.word}</span>`;
        btn.onclick = () => onSelectMatchTarget(btn);
        leftCol.appendChild(btn);
      });

      speak("اضغط على الحرف ثم اضغط على صورته الصحيحة!", currentCategoryData[0]?.lang || 'ar-EG');
    }

    function onSelectMatchLetter(btn) {
      if (btn.classList.contains('matched')) return;
      document.querySelectorAll('#match-col-right .match-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedLetterBtn = btn;
      const found = matchPairsList.find(p => p.char === btn.dataset.char);
      speak(found ? found.name : btn.dataset.char, found?.lang || 'ar-EG');
    }

    function onSelectMatchTarget(btn) {
      if (!selectedLetterBtn || btn.classList.contains('matched')) return;

      if (btn.dataset.char === selectedLetterBtn.dataset.char) {
        // مطابقة صحيحة
        btn.classList.add('matched');
        selectedLetterBtn.classList.add('matched');
        selectedLetterBtn.classList.remove('selected');

        const item = matchPairsList.find(p => p.char === btn.dataset.char);
        speak(`أَحْسَنْتْ! ${item.name} مَعَ ${item.word}`, item?.lang || 'ar-EG');
        selectedLetterBtn = null;

        // التحقق من اكتمال التوصيل
        const matchedCount = document.querySelectorAll('#match-col-right .matched').length;
        if (matchedCount === matchPairsList.length) {
          setTimeout(() => {
            speak("شَاطِرْ جِدّاً يَا بَطَلْ! وَصَّلْتْ كُلَّ الحَاجَاتِ صَحْ! 🎉", currentCategoryData[0]?.lang || 'ar-EG');
            setTimeout(startMatchingGame, 2000);
          }, 800);
        }
      } else {
        speak("حَاوِلْ تَانِي، اخْتَارْ الصُّورَة الصَّحِيحَة!", currentCategoryData[0]?.lang || 'ar-EG');
      }
    }

    /* 2. التلوين الذكي بملء الشاشة */
    let canvas, ctx, painting = false;
    let currentColor = '#EF4444';
    let colorCharIdx = 0;

    function initColoringCanvas() {
      canvas = document.getElementById('paint-canvas');
      // مطابقة الدقة مع الشاشة
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      ctx = canvas.getContext('2d');
      setupFullScreenColoringEvents();
      drawHugeClippedLetter();
    }

    function drawHugeClippedLetter() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const item = currentCategoryData[colorCharIdx % currentCategoryData.length];

      // حرف ضخم جداً يملأ 80% من الكانفاس
      const fontSize = Math.floor(canvas.height * 0.72);
      ctx.font = `900 ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // رسم الحرف من الداخل بلون رمادي فاتح ليكون هو القناع
      ctx.fillStyle = '#F1F5F9';
      ctx.fillText(item.char, canvas.width / 2, canvas.height / 2 + 15);

      // رسم حدود الحرف الخارجية العريضة
      ctx.lineWidth = Math.max(12, fontSize * 0.05);
      ctx.strokeStyle = '#CBD5E1';
      ctx.strokeText(item.char, canvas.width / 2, canvas.height / 2 + 15);

      speak(`يَلَّا نْلَوِّنْ ${item.name}!`, item.lang || 'ar-EG');
    }

    function nextColoringChar() {
      colorCharIdx++;
      drawHugeClippedLetter();
    }

    function clearCanvas() {
      drawHugeClippedLetter();
    }

    function setColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setupFullScreenColoringEvents() {
      const getPos = e => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
      };

      const start = e => {
        painting = true;
        ctx.beginPath();
        const p = getPos(e);
        ctx.moveTo(p.x, p.y);
      };

      const move = e => {
        if (!painting) return;
        const p = getPos(e);

        ctx.save();
        // قفل اللون داخل الحرف بحيث لا يخرج منه أبداً
        ctx.globalCompositeOperation = 'source-atop';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = Math.max(36, canvas.height * 0.08); // فرشاة سميكة تملأ بسهولة
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.restore();

        // إعادة تنعيم الحدود الخارجية فوق التلوين
        const item = currentCategoryData[colorCharIdx % currentCategoryData.length];
        const fontSize = Math.floor(canvas.height * 0.72);
        ctx.font = `900 ${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = Math.max(8, fontSize * 0.04);
        ctx.strokeStyle = '#94A3B8';
        ctx.strokeText(item.char, canvas.width / 2, canvas.height / 2 + 15);
      };

      const stop = () => { painting = false; };

      canvas.onmousedown = start;
      window.onmousemove = move;
      window.onmouseup = stop;
      canvas.ontouchstart = start;
      window.ontouchmove = move;
      window.ontouchend = stop;
    }

    /* 3. لعبة قفز الضفدع */
    let jumpTargetChar = null;
    function startJumpingGame() {
      const stage = document.getElementById('jump-stage');
      const frog = document.getElementById('frog-hero');
      frog.style.left = '50%';
      frog.style.bottom = '12px';

      // إزالة أي أهداف قديمة
      document.querySelectorAll('.jump-target').forEach(el => el.remove());

      const list = [...currentCategoryData].sort(() => 0.5 - Math.random()).slice(0, 3);
      const target = list[Math.floor(Math.random() * list.length)];
      jumpTargetChar = target;

      document.getElementById('jump-task-title').innerText = `انقر ليقفز الضفدع نحو (${target.name})! 🐸`;
      speak(`انقر ليقفز الضفدع نحو ${target.name}!`, target.lang || 'ar-EG');

      const positions = ['15%', '50%', '85%'];
      list.forEach((item, idx) => {
        const bubble = document.createElement('div');
        bubble.className = 'jump-target';
        bubble.style.left = positions[idx];
        bubble.style.transform = 'translateX(-50%)';
        bubble.innerText = item.char;
        bubble.onclick = () => onFrogJump(bubble, item);
        stage.appendChild(bubble);
      });
    }

    function onFrogJump(targetEl, item) {
      const frog = document.getElementById('frog-hero');
      const rect = targetEl.getBoundingClientRect();
      const stageRect = document.getElementById('jump-stage').getBoundingClientRect();

      // حركة قفز سلسة للضفدع
      frog.style.left = (rect.left - stageRect.left + 36) + 'px';
      frog.style.bottom = '180px';

      setTimeout(() => {
        if (item.char === jumpTargetChar.char) {
          speak("عَاشْ يَا بَطَلْ! قَفْزَة صَحِيحَة! 🎉", item.lang || 'ar-EG');
          targetEl.style.background = '#86EFAC';
          setTimeout(startJumpingGame, 1800);
        } else {
          speak("أُوووبس! حَاوِلْ مَرَّة تَانِيَة!", item.lang || 'ar-EG');
          frog.style.bottom = '12px';
          frog.style.left = '50%';
        }
      }, 400);
    }

    /* 4. لعبة فرقعة الفقاعات */
    let bubbleTargetChar = null;
    function startBubblesGame() {
      const stage = document.getElementById('bubble-stage');
      stage.innerHTML = '';

      const list = [...currentCategoryData].sort(() => 0.5 - Math.random()).slice(0, 4);
      const target = list[Math.floor(Math.random() * list.length)];
      bubbleTargetChar = target;

      document.getElementById('bubbles-task-title').innerText = `فَرْقَعْ فُقَّاعَة (${target.name})! 🫧`;
      speak(`فَرْقَعْ فُقَّاعَة ${target.name}!`, target.lang || 'ar-EG');

      const coords = [
        { x: '12%', y: '30px' }, { x: '55%', y: '40px' },
        { x: '25%', y: '160px' }, { x: '68%', y: '170px' }
      ];

      list.forEach((item, idx) => {
        const b = document.createElement('div');
        b.className = 'bubble-item';
        b.style.left = coords[idx].x;
        b.style.top = coords[idx].y;
        b.innerText = item.char;
        b.onclick = () => onPopBubble(b, item);
        stage.appendChild(b);
      });
    }

    function onPopBubble(bubbleEl, item) {
      if (item.char === bubbleTargetChar.char) {
        bubbleEl.style.transform = 'scale(1.5)';
        bubbleEl.style.opacity = '0';
        speak("بُوووبْ! شَاطِرْ يَا بَطَلْ! 🎉", item.lang || 'ar-EG');
        setTimeout(startBubblesGame, 1600);
      } else {
        speak("دِي فُقَّاعَة تَانِيَة، حَاوِلْ مَرَّة كَمَانْ!", item.lang || 'ar-EG');
      }
    }

    /* محرك النطق المصري */
    let cachedVoices = [];
    function loadVoices() { cachedVoices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text, lang = 'ar-EG') {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.86;
      u.pitch = 1.2;

      if (lang.startsWith('ar') && cachedVoices.length > 0) {
        const eg = cachedVoices.find(v => v.lang.includes('EG') || v.name.includes('Maged') || v.name.includes('Maryam'));
        if (eg) u.voice = eg;
      }
      window.speechSynthesis.speak(u);
    }

    async function forceAppUpdate() {
      if (!navigator.onLine) return alert('يرجى الاتصال بالإنترنت أولاً لتحديث اللعبة.');
      if (confirm('تحديث اللعبة وتنزيل كل الميزات والألعاب الجديدة؟')) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        window.location.reload(true);
      }
    }
  </script>
